<title>Логотип Archiwood 3D</title>
<style>
  /* Сцена во весь экран, сверху — переключатель версий. Цвета и шрифты с сайта Archiwood. */
  :root {
    --cream: #faf0e6;
    --copper: #c18048;
    --stone: #95948f;
    --ink: #1a1a1a;
    --panel: rgba(250, 240, 230, 0.86);
    --panel-ink: #1a1a1a;
    --f-display: 'Cormorant', 'Cormorant Garamond', Georgia, serif;
    --f-body: Arial, 'Helvetica Neue', Helvetica, sans-serif;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg, var(--cream)); color: var(--panel-ink); font: 14px/1.5 var(--f-body); overflow: hidden; transition: background-color .8s; }
  #scene { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #scene:active { cursor: grabbing; }

  .bar {
    position: fixed; z-index: 2; left: 50%; top: calc(16px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
    width: min(980px, calc(100% - 32px)); display: grid; gap: 12px; padding: 14px 16px;
    background: var(--panel); color: var(--panel-ink); border: 1px solid rgba(193, 128, 72, .35);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  }
  .bar__head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 20px; }
  .bar h1 { margin: 0; font: 500 24px/1.1 var(--f-display); color: var(--copper); }
  .bar__hint { color: var(--stone); font-size: 12px; letter-spacing: .04em; }
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; }
  .tabs button {
    padding: 9px 16px; border: 1px solid rgba(193, 128, 72, .5); border-radius: 40px; background: transparent; color: var(--copper);
    font: bold 11px/1 var(--f-body); letter-spacing: 1.4px; text-transform: uppercase; cursor: pointer; transition: background-color .3s, color .3s;
  }
  .tabs button:hover { background: rgba(193, 128, 72, .12); }
  .tabs button[aria-pressed="true"] { background: var(--copper); color: #fff; border-color: var(--copper); }
  .tabs button:focus-visible, .ctl button:focus-visible { outline: 2px solid var(--copper); outline-offset: 2px; }

  .info {
    position: fixed; z-index: 2; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    width: min(980px, calc(100% - 32px)); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px;
    padding: 12px 16px; background: var(--panel); color: var(--panel-ink); border: 1px solid rgba(193, 128, 72, .35);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  }
  .info p { margin: 0; max-width: 62ch; min-width: 0; }
  .info b { font: 500 19px/1.2 var(--f-display); color: var(--copper); margin-right: 8px; }
  .ctl { display: flex; gap: 8px; }
  .ctl button {
    padding: 8px 14px; border: 1px solid rgba(26, 26, 26, .25); border-radius: 40px; background: transparent; color: var(--panel-ink);
    font: 12px/1 var(--f-body); cursor: pointer;
  }
  .ctl button[aria-pressed="false"] { opacity: .55; }
  .fallback { position: fixed; inset: 0; display: none; place-items: center; padding: 120px 24px; }
  .fallback img { width: min(560px, 90vw); }
  .no-webgl .fallback { display: grid; }
  @media (max-width: 600px) {
    .bar h1 { font-size: 20px; }
    .tabs button { padding: 8px 12px; font-size: 10px; }
    .info { font-size: 13px; }
  }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant:wght@500&display=swap">

<canvas id="scene" aria-label="Трехмерный логотип Archiwood"></canvas>
<div class="fallback"><img alt="Логотип Archiwood" src="data:image/svg+xml;utf8,__SVG_URI__"></div>

<div class="bar">
  <div class="bar__head">
    <h1>Логотип Archiwood в 3D</h1>
    <span class="bar__hint">Потяните логотип мышью или пальцем</span>
  </div>
  <div class="tabs" role="group" aria-label="Версии логотипа">
    <button type="button" data-v="med">1 · Медь</button>
    <button type="button" data-v="hrom">2 · Хром и стекло</button>
    <button type="button" data-v="derevo">3 · Орех и медь</button>
    <button type="button" data-v="zoloto">4 · Золото в ночи</button>
    <button type="button" data-v="farfor">5 · Кремовый рельеф</button>
  </div>
</div>

<div class="info">
  <p id="about"></p>
  <div class="ctl">
    <button type="button" id="breath" aria-pressed="true">Дыхание</button>
    <button type="button" id="spin" aria-pressed="false">Вращение</button>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { SVGLoader } from 'three/addons/loaders/SVGLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const SVG = `__SVG__`;

const canvas = document.getElementById('scene');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
} catch (e) {
  document.documentElement.classList.add('no-webgl');
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
camera.position.set(0, 0.15, 9);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

/* ---------- Геометрия логотипа из SVG ---------- */
const data = new SVGLoader().parse(SVG);
const shapes = [];
data.paths.forEach((p) => SVGLoader.createShapes(p).forEach((s) => shapes.push(s)));
const DEPTH = 70;
const geo = new THREE.ExtrudeGeometry(shapes, {
  depth: DEPTH, bevelEnabled: true, bevelThickness: 10, bevelSize: 4, bevelSegments: 4, curveSegments: 10,
});
geo.computeBoundingBox();
const bb = geo.boundingBox;
geo.translate(-(bb.max.x + bb.min.x) / 2, -(bb.max.y + bb.min.y) / 2, -DEPTH / 2);
const S = 5.6 / (bb.max.x - bb.min.x);
geo.scale(S, -S, S); // SVG смотрит вниз по Y — переворачиваем
geo.computeVertexNormals();

const logo = new THREE.Group();
const mesh = new THREE.Mesh(geo);
logo.add(mesh);
scene.add(logo);

/* ---------- Текстуры, нарисованные в браузере ---------- */
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
// Лучи света за логотипом
function raysTex(color) {
  return canvasTex(1024, 1024, (g, w, h) => {
    const cx = w / 2, cy = h / 2;
    const glow = g.createRadialGradient(cx, cy, 0, cx, cy, w / 2);
    glow.addColorStop(0, color + '88'); glow.addColorStop(.22, color + '22'); glow.addColorStop(1, color + '00');
    g.fillStyle = glow; g.fillRect(0, 0, w, h);
    g.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 30; i++) {
      const a = (i / 46) * Math.PI * 2 + Math.random() * .08;
      const len = w * (.28 + Math.random() * .24);
      const wid = .002 + Math.random() * .006;
      const grd = g.createLinearGradient(cx, cy, cx + Math.cos(a) * len, cy + Math.sin(a) * len);
      grd.addColorStop(0, color + '55'); grd.addColorStop(1, color + '00');
      g.fillStyle = grd; g.beginPath(); g.moveTo(cx, cy);
      g.lineTo(cx + Math.cos(a - wid) * len, cy + Math.sin(a - wid) * len);
      g.lineTo(cx + Math.cos(a + wid) * len, cy + Math.sin(a + wid) * len); g.closePath(); g.fill();
    }
  });
}
// Текстура ореха для лицевой стороны
const walnut = canvasTex(1024, 1024, (g, w, h) => {
  g.fillStyle = '#5a3a24'; g.fillRect(0, 0, w, h);
  for (let y = 0; y < h; y += 1) {
    const v = Math.sin(y * .045 + Math.sin(y * .011) * 3) * .5 + .5;
    const n = Math.random() * .08;
    const l = 26 + v * 18 + n * 40;
    g.fillStyle = `hsl(${24 + v * 4}, ${42 + v * 8}%, ${l}%)`; g.fillRect(0, y, w, 1);
  }
  g.globalAlpha = .18;
  for (let i = 0; i < 260; i++) {
    g.strokeStyle = Math.random() > .5 ? '#2c1a0f' : '#8a5a36'; g.lineWidth = Math.random() * 2;
    g.beginPath(); const y = Math.random() * h; g.moveTo(0, y);
    for (let x = 0; x <= w; x += 32) g.lineTo(x, y + Math.sin(x * .01 + i) * 6);
    g.stroke();
  }
});
walnut.wrapS = walnut.wrapT = THREE.RepeatWrapping;
walnut.repeat.set(.0016, .0016); // UV в единицах SVG (ширина ~2900)
walnut.rotation = Math.PI / 2;

/* ---------- Лучи и тень ---------- */
const rays = new THREE.Mesh(new THREE.PlaneGeometry(16, 16), new THREE.MeshBasicMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
rays.position.z = -2.2;
scene.add(rays);

const shadowTex = canvasTex(256, 256, (g, w, h) => {
  const r = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
  r.addColorStop(0, 'rgba(0,0,0,.55)'); r.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = r; g.fillRect(0, 0, w, h);
});
const shadow = new THREE.Mesh(new THREE.PlaneGeometry(6.5, 1.1), new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false }));
shadow.rotation.x = -Math.PI / 2;
shadow.position.y = -2.15;
scene.add(shadow);

/* ---------- Свет ---------- */
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(3, 4, 6); scene.add(key);
const rim = new THREE.DirectionalLight(0xffe2c4, 1.4); rim.position.set(-5, 2, -3); scene.add(rim);
const fill = new THREE.AmbientLight(0xffffff, .25); scene.add(fill);

/* ---------- Постобработка: свечение ---------- */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), .5, .5, .82);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ---------- Версии ---------- */
const V = {
  med: {
    name: 'Медь', bg: '#faf0e6', panel: 'rgba(250,240,230,.86)', ink: '#1a1a1a',
    text: 'Полированная медь цвета вашего логотипа на кремовом фоне сайта. Под логотипом мягкая тень — он парит над страницей.',
    front: () => new THREE.MeshPhysicalMaterial({ color: 0xd08a52, metalness: 1, roughness: .22, clearcoat: .6, clearcoatRoughness: .2 }),
    side: () => new THREE.MeshStandardMaterial({ color: 0xa8652f, metalness: 1, roughness: .32 }),
    rays: null, bloom: 0, shadow: .55, exposure: 1.05, env: 1,
  },
  hrom: {
    name: 'Хром и стекло', bg: '#07090c', panel: 'rgba(20,22,26,.78)', ink: '#f2ece4',
    text: 'По вашему референсу: зеркальный хром по граням, стеклянная лицевая сторона и лучи света за логотипом.',
    front: () => new THREE.MeshPhysicalMaterial({ color: 0x9fb6cc, metalness: .25, roughness: .06, transmission: .55, thickness: .6, ior: 1.5, clearcoat: 1, clearcoatRoughness: .04, iridescence: .3 }),
    side: () => new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 1, roughness: .05 }),
    rays: '#cfe3ff', bloom: .4, shadow: 0, exposure: 1.15, env: 1.4,
  },
  derevo: {
    name: 'Орех и медь', bg: '#2a1d14', panel: 'rgba(42,29,20,.8)', ink: '#f4e7d8',
    text: 'Лицо логотипа — текстура ореха, как в ваших интерьерах, грани — медь. Самая «столярная» версия.',
    front: () => new THREE.MeshPhysicalMaterial({ map: walnut, roughness: .55, metalness: 0, clearcoat: .5, clearcoatRoughness: .35 }),
    side: () => new THREE.MeshStandardMaterial({ color: 0xc8813f, metalness: 1, roughness: .28 }),
    rays: '#e0a46a', bloom: .15, shadow: 0, exposure: .95, env: .45,
  },
  zoloto: {
    name: 'Золото в ночи', bg: '#0f0d0b', panel: 'rgba(24,20,16,.8)', ink: '#f6ecdc',
    text: 'Яркое золото с сиянием на темном фоне. Подходит для заставки или видео в соцсетях.',
    front: () => new THREE.MeshPhysicalMaterial({ color: 0xf0c060, metalness: 1, roughness: .16, clearcoat: .4 }),
    side: () => new THREE.MeshStandardMaterial({ color: 0xc9902e, metalness: 1, roughness: .22 }),
    rays: '#f3b35a', bloom: .45, shadow: 0, exposure: 1.05, env: 1.2,
  },
  farfor: {
    name: 'Кремовый рельеф', bg: '#faf0e6', panel: 'rgba(250,240,230,.86)', ink: '#1a1a1a',
    text: 'Матовый кремовый рельеф на кремовом фоне: логотип читается только светом и тенью. Самая тихая и дорогая версия, в духе Hermès.',
    front: () => new THREE.MeshPhysicalMaterial({ color: 0xead3bb, metalness: 0, roughness: .55, sheen: .3, sheenColor: 0xffffff }),
    side: () => new THREE.MeshStandardMaterial({ color: 0xc9a988, metalness: 0, roughness: .75 }),
    rays: null, bloom: 0, shadow: .45, exposure: .9, env: .55, light: 3,
  },
};

const about = document.getElementById('about');
const tabs = [...document.querySelectorAll('[data-v]')];
let current = null;
function apply(id) {
  const v = V[id] || V.med;
  current = v;
  mesh.material?.forEach?.((m) => m.dispose());
  mesh.material = [v.front(), v.side()];
  document.body.style.setProperty('--bg', v.bg);
  document.documentElement.style.setProperty('--panel', v.panel);
  document.documentElement.style.setProperty('--panel-ink', v.ink);
  scene.background = new THREE.Color(v.bg);
  scene.environmentIntensity = v.env;
  renderer.toneMappingExposure = v.exposure;
  rays.visible = !!v.rays;
  if (v.rays) { rays.material.map?.dispose(); rays.material.map = raysTex(v.rays); rays.material.needsUpdate = true; }
  bloom.strength = v.bloom;
  shadow.visible = v.shadow > 0;
  shadow.material.opacity = v.shadow;
  key.intensity = v.light || 2.2;
  about.innerHTML = `<b>${v.name}</b>${v.text}`;
  tabs.forEach((t) => t.setAttribute('aria-pressed', t.dataset.v === id ? 'true' : 'false'));
  if (location.hash.slice(1) !== id) history.replaceState(null, '', '#' + id);
}
tabs.forEach((t) => t.addEventListener('click', () => apply(t.dataset.v)));
apply(location.hash.slice(1) || 'med');

/* ---------- Управление ---------- */
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let breathe = !reduce, spin = false;
const bBtn = document.getElementById('breath'), sBtn = document.getElementById('spin');
bBtn.setAttribute('aria-pressed', String(breathe));
bBtn.onclick = () => { breathe = !breathe; bBtn.setAttribute('aria-pressed', String(breathe)); };
sBtn.onclick = () => { spin = !spin; sBtn.setAttribute('aria-pressed', String(spin)); };

// Наклон за мышью и вращение пальцем
let tx = 0, ty = 0, drag = null, dragY = 0, dragX = 0;
addEventListener('pointermove', (e) => {
  if (drag) { dragY = drag.y + (e.clientX - drag.x) * .008; dragX = drag.rx + (e.clientY - drag.cy) * .004; return; }
  tx = (e.clientX / innerWidth - .5); ty = (e.clientY / innerHeight - .5);
});
canvas.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, cy: e.clientY, y: dragY, rx: dragX }; canvas.setPointerCapture(e.pointerId); });
addEventListener('pointerup', () => { drag = null; });

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); composer.setSize(w, h); bloom.resolution.set(w, h);
  camera.aspect = w / h;
  // на узком экране отодвигаем камеру, чтобы логотип помещался по ширине
  camera.position.z = w / h < 1 ? 9 / (w / h) * .62 : 9;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

/* ---------- Анимация: парение и дыхание ---------- */
const clock = new THREE.Clock();
let spinAngle = 0, rotY = 0, rotX = 0;
function frame() {
  const t = clock.getElapsedTime();
  const b = breathe ? Math.sin(t * Math.PI * 2 / 5.5) : 0;      // вдох-выдох за 5,5 секунды
  const float = breathe ? Math.sin(t * Math.PI * 2 / 7) : 0;     // медленное парение
  if (spin) spinAngle += .006; else spinAngle *= .96;
  if (!drag) { dragY *= .94; dragX *= .94; }
  rotY += ((tx * .55 + Math.sin(t * .35) * (breathe ? .12 : 0)) + dragY + spinAngle - rotY) * .06;
  rotX += ((ty * .3) + dragX - rotX) * .06;
  logo.rotation.set(rotX, rotY, breathe ? Math.sin(t * .5) * .015 : 0);
  logo.position.y = .12 + float * .1;
  logo.scale.setScalar(1 + b * .022);
  shadow.scale.set(1 - float * .08, 1, 1);
  shadow.material.opacity = (current.shadow || 0) * (1 - float * .25);
  if (rays.visible) { rays.rotation.z = t * .03; rays.material.opacity = .45 + b * .15; rays.scale.setScalar(1 + b * .05); }
  key.position.x = 3 + Math.sin(t * .4) * 1.5;
  bloom.strength = current.bloom * (1 + b * .2);
  if (current.bloom > 0) composer.render(); else renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();
</script>
