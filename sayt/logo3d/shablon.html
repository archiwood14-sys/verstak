<meta charset="utf-8">
<title>Логотип Archiwood 3D</title>
<style>
  /* Сцена во весь экран, прозрачная. Сверху выбор версии, снизу описание. Цвета и шрифты сайта Archiwood. */
  :root {
    --cream: #faf0e6;
    --copper: #c18048;
    --stone: #95948f;
    --ink: #1a1a1a;
    --panel: rgba(250, 240, 230, 0.88);
    --f-display: 'Cormorant', 'Cormorant Garamond', Georgia, serif;
    --f-body: Arial, 'Helvetica Neue', Helvetica, sans-serif;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--cream); color: var(--ink); font: 14px/1.5 var(--f-body); overflow: hidden; transition: background-color .6s; }
  body[data-bg="check"] { background-color: #ffffff; background-image: conic-gradient(#e6e1da 25%, #ffffff 0 50%, #e6e1da 0 75%, #ffffff 0); background-size: 28px 28px; }
  body[data-bg="cream"] { background: var(--cream); }
  body[data-bg="dark"] { background: #141210; }
  #scene { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #scene:active { cursor: grabbing; }

  .panel {
    position: fixed; z-index: 2; left: 50%; transform: translateX(-50%); width: min(1000px, calc(100% - 32px));
    padding: 12px 16px; background: var(--panel); border: 1px solid rgba(193, 128, 72, .35);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  }
  .top { top: calc(14px + env(safe-area-inset-top, 0px)); display: grid; gap: 10px; }
  .bottom { bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; }
  .head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 20px; }
  h1 { margin: 0; font: 500 24px/1.1 var(--f-display); color: var(--copper); }
  .hint { color: var(--stone); font-size: 12px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .row button {
    padding: 8px 15px; border: 1px solid rgba(193, 128, 72, .5); border-radius: 40px; background: transparent; color: var(--copper);
    font: bold 11px/1 var(--f-body); letter-spacing: 1.3px; text-transform: uppercase; cursor: pointer; transition: background-color .3s, color .3s;
  }
  .row button:hover { background: rgba(193, 128, 72, .12); }
  .row button[aria-pressed="true"] { background: var(--copper); border-color: var(--copper); color: #fff; }
  .row--small button { padding: 6px 11px; font-size: 10px; }
  button:focus-visible { outline: 2px solid var(--copper); outline-offset: 2px; }
  #about { margin: 0; max-width: 64ch; min-width: 0; }
  #about b { font: 500 19px/1.2 var(--f-display); color: var(--copper); margin-right: 8px; }
  .loading { position: fixed; inset: 0; display: grid; place-items: center; color: var(--stone); font-size: 13px; letter-spacing: .1em; pointer-events: none; }
  .loading[hidden] { display: none; }
  @media (max-width: 600px) { h1 { font-size: 20px; } .row button { padding: 7px 11px; font-size: 10px; } }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant:wght@500&display=swap">

<canvas id="scene" aria-label="Трехмерный логотип Archiwood"></canvas>
<div class="loading" id="loading">Загрузка логотипа…</div>

<div class="panel top">
  <div class="head"><h1>Логотип Archiwood · барельеф</h1><span class="hint">Наведите или потяните — логотип чуть повернется</span></div>
  <div class="row" role="group" aria-label="Версии логотипа">
    <button type="button" data-v="med">1 · Медь</button>
    <button type="button" data-v="zoloto">2 · Золото</button>
    <button type="button" data-v="hrom">3 · Хром</button>
    <button type="button" data-v="bronza">4 · Бронза</button>
    <button type="button" data-v="krem">5 · Кремовый рельеф</button>
  </div>
  <div class="row row--small" role="group" aria-label="Фон под логотипом">
    <span class="hint">Фон прозрачный. Подложка для проверки:</span>
    <button type="button" data-bg="check">Шахматка</button>
    <button type="button" data-bg="cream">Кремовый</button>
    <button type="button" data-bg="dark">Темный</button>
  </div>
</div>

<div class="panel bottom">
  <p id="about"></p>
  <div class="row row--small">
    <button type="button" id="breath" aria-pressed="true">Дыхание</button>
    <button type="button" id="glint" aria-pressed="true">Блик</button>
    <button type="button" id="shadowBtn" aria-pressed="true">Тень</button>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { SVGLoader } from 'three/addons/loaders/SVGLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const INFO = __INFO__;
const SVGS = __SVGS__;

/* ---------- Рендер с прозрачным фоном ---------- */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setClearColor(0x000000, 0);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(26, 1, 0.1, 100);
camera.position.set(0, 0, 12);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.03).texture;

/* ---------- Масштаб: пиксели рисунка → сцена ---------- */
const W = INFO.width, H = INFO.height;
const S = 5.6 / W;                              // ширина логотипа 5,6 единицы
const toX = (x) => (x - W / 2) * S;
const toY = (y) => -(y - H / 2) * S;

const logo = new THREE.Group();
scene.add(logo);

// Выдавливание контура с граненой фаской. Толщины в пикселях рисунка.
function extrude(svg, depth, bevel, segments = 1) {
  const shapes = [];
  new SVGLoader().parse(svg).paths.forEach((p) => SVGLoader.createShapes(p).forEach((s) => shapes.push(s)));
  const g = new THREE.ExtrudeGeometry(shapes, { depth, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: segments, curveSegments: 12 });
  g.translate(-W / 2, -H / 2, -(depth + bevel));   // лицевая сторона в z = 0
  g.scale(S, -S, S);
  g.computeVertexNormals();
  return g;
}

/* ---------- Части логотипа ---------- */
const K = INFO.kolesnica;
const RELIEF = 0.085;                           // высота барельефа
const baseGeo = extrude(SVGS.kolesnica, 30, 4, 3);
const lineGeo = extrude(SVGS.liniya, 30, 7, 1);
const textGeo = extrude(SVGS.nadpis, 46, 10, 1);
const cityGeo = extrude(SVGS.gorod, 30, 3, 1);

const loader = new THREE.TextureLoader();
const tex = (name, srgb) => new Promise((res) => loader.load(name, (t) => { if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; res(t); }));
const [heightT, normalT, patinaT, alphaT] = await Promise.all([
  tex('kolesnica-vysota.png'), tex('kolesnica-normali.png'), tex('kolesnica-patina.png', true), tex('kolesnica-silhuet.png'),
]);
document.getElementById('loading').hidden = true;

const reliefGeo = new THREE.PlaneGeometry(K.w * S, K.h * S, 720, Math.round(720 * K.h / K.w));
reliefGeo.translate(toX(K.x + K.w / 2), toY(K.y + K.h / 2), 0.002);

const base = new THREE.Mesh(baseGeo);
const relief = new THREE.Mesh(reliefGeo);
const line = new THREE.Mesh(lineGeo);
const text = new THREE.Mesh(textGeo);
const city = new THREE.Mesh(cityGeo);
logo.add(base, relief, line, text, city);

/* ---------- Мягкая тень под парящим логотипом ---------- */
const sc = document.createElement('canvas'); sc.width = sc.height = 256;
const sg = sc.getContext('2d'); const rg = sg.createRadialGradient(128, 128, 0, 128, 128, 128);
rg.addColorStop(0, 'rgba(0,0,0,.5)'); rg.addColorStop(1, 'rgba(0,0,0,0)'); sg.fillStyle = rg; sg.fillRect(0, 0, 256, 256);
const shadow = new THREE.Mesh(new THREE.PlaneGeometry(6, .9), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(sc), transparent: true, depthWrite: false }));
shadow.rotation.x = -Math.PI / 2; shadow.position.set(0, -1.75, .3);
scene.add(shadow);

/* ---------- Свет: основной, контровой и бегущий блик ---------- */
const key = new THREE.DirectionalLight(0xfff4e8, 2.4); key.position.set(-3, 5, 6); scene.add(key);
const rim = new THREE.DirectionalLight(0xffe0c0, 1.2); rim.position.set(5, -2, 3); scene.add(rim);
const glint = new THREE.PointLight(0xffffff, 0, 6, 1.2); glint.position.set(-6, .6, 1.2); scene.add(glint);

/* ---------- Версии ---------- */
const V = {
  med: {
    name: 'Медь', text: 'Полированная медь цвета вашего логотипа. Кони, колесница и возничий — выпуклые, линии между ними — гравировка с темной патиной.',
    color: 0xc98250, metal: 1, rough: .26, edge: 0xa9622c, exposure: 1.05, env: 1,
  },
  zoloto: {
    name: 'Золото', text: 'Желтое золото, как на ювелирной медали. Самая праздничная версия.',
    color: 0xe7b65a, metal: 1, rough: .2, edge: 0xc48c2c, exposure: 1.0, env: 1.1,
  },
  hrom: {
    name: 'Хром', text: 'Зеркальный хром по вашему референсу: холодный блеск и четкие грани букв. На темной подложке смотрится лучше всего.',
    color: 0xe4e8ec, metal: 1, rough: .1, edge: 0xc9ced4, exposure: 1.05, env: 1.3,
  },
  bronza: {
    name: 'Бронза', text: 'Темная состаренная бронза с теплым блеском на выпуклостях — как старинная табличка мастерской.',
    color: 0x9a6a3c, metal: .95, rough: .38, edge: 0x6e4826, exposure: 1.15, env: .9,
  },
  krem: {
    name: 'Кремовый рельеф', text: 'Матовый рельеф в цвет фона сайта: рисунок проявляется только светом и тенью. Тихая версия в духе Hermès.',
    color: 0xe6cdb0, metal: 0, rough: .55, edge: 0xc9a782, exposure: .85, env: .5,
  },
};

let current;
function apply(id) {
  const v = V[id] || V.med; current = v;
  [base, relief, line, text, city].forEach((m) => m.material?.dispose?.());
  const face = () => new THREE.MeshPhysicalMaterial({ color: v.color, metalness: v.metal, roughness: v.rough, clearcoat: v.metal ? .3 : 0, clearcoatRoughness: .2 });
  relief.material = new THREE.MeshPhysicalMaterial({
    color: v.color, metalness: v.metal, roughness: v.rough, clearcoat: v.metal ? .3 : 0, clearcoatRoughness: .2,
    map: patinaT, normalMap: normalT, normalScale: new THREE.Vector2(1.1, 1.1),
    displacementMap: heightT, displacementScale: RELIEF, alphaMap: alphaT, alphaTest: .5,
  });
  base.material = [face(), new THREE.MeshStandardMaterial({ color: v.edge, metalness: v.metal, roughness: v.rough + .08 })];
  line.material = text.material = city.material = face();
  scene.environmentIntensity = v.env;
  renderer.toneMappingExposure = v.exposure;
  document.getElementById('about').innerHTML = `<b>${v.name}</b>${v.text}`;
  document.querySelectorAll('[data-v]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.v === id ? 'true' : 'false'));
  history.replaceState(null, '', '#' + id);
}
document.querySelectorAll('[data-v]').forEach((b) => b.addEventListener('click', () => apply(b.dataset.v)));
apply(location.hash.slice(1) || 'med');

/* ---------- Подложка и переключатели ---------- */
const bgBtns = [...document.querySelectorAll('[data-bg]')];
const setBg = (id) => { document.body.dataset.bg = id; bgBtns.forEach((b) => b.setAttribute('aria-pressed', b.dataset.bg === id ? 'true' : 'false')); };
bgBtns.forEach((b) => b.addEventListener('click', () => setBg(b.dataset.bg)));
setBg('check');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const flags = { breath: !reduce, glint: true, shadow: true };
[['breath', 'breath'], ['glint', 'glint'], ['shadowBtn', 'shadow']].forEach(([id, k]) => {
  const b = document.getElementById(id); b.setAttribute('aria-pressed', String(flags[k]));
  b.onclick = () => { flags[k] = !flags[k]; b.setAttribute('aria-pressed', String(flags[k])); };
});

/* ---------- Наклон: только слегка, чтобы рисунок всегда читался ---------- */
let tx = 0, ty = 0, drag = null;
addEventListener('pointermove', (e) => {
  const nx = e.clientX / innerWidth - .5, ny = e.clientY / innerHeight - .5;
  if (drag) { tx = THREE.MathUtils.clamp(drag.tx + (e.clientX - drag.x) / innerWidth * 1.6, -.5, .5); ty = THREE.MathUtils.clamp(drag.ty + (e.clientY - drag.y) / innerHeight * 1.6, -.5, .5); return; }
  if (e.pointerType === 'mouse') { tx = nx; ty = ny; }
});
canvas.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY, tx, ty }; canvas.setPointerCapture(e.pointerId); });
addEventListener('pointerup', () => { drag = null; });

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.position.z = w / h < 1.15 ? 12 * 1.15 / (w / h) * .9 : 12;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

/* ---------- Анимация ---------- */
const clock = new THREE.Clock();
let ry = 0, rx = 0;
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  const b = flags.breath ? Math.sin(t * Math.PI * 2 / 6) : 0;     // вдох-выдох за 6 секунд
  const f = flags.breath ? Math.sin(t * Math.PI * 2 / 8) : 0;     // парение
  if (!drag && !matchMedia('(pointer: fine)').matches) { tx *= .98; ty *= .98; }
  ry += ((tx * .42 + (flags.breath ? Math.sin(t * .3) * .06 : 0)) - ry) * .05;   // не больше ~12° вбок
  rx += ((ty * .22) - rx) * .05;                                                 // не больше ~6° по высоте
  logo.rotation.set(rx, ry, 0);
  logo.position.y = .15 + f * .07;
  logo.scale.setScalar(1 + b * .015);
  shadow.visible = flags.shadow;
  shadow.material.opacity = .9 - f * .2;
  shadow.scale.x = 1 - f * .06;
  // блик пробегает слева направо раз в 7 секунд
  const p = (t % 7) / 7;
  glint.intensity = flags.glint ? Math.sin(Math.min(p / .45, 1) * Math.PI) * 40 : 0;
  glint.position.x = -6 + Math.min(p / .45, 1) * 12;
  key.intensity = 2.4 + b * .25;
  renderer.render(scene, camera);
});
</script>
