<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Пилоты на согласование — ARCHIWOOD</title>
<link rel="icon" href="logo.png">
<style>
  :root{
    --fon:#f6f5f3; --karta:#fff; --tekst:#1c1a17; --tusklo:#6b665e;
    --liniya:#e3ded6; --akcent:#c08a4f; --svezhee:#2f7d4f; --zhdem:#b0aaa0;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--fon);color:var(--tekst);
       font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       -webkit-text-size-adjust:100%}

  /* шапка: логотип по центру, чтобы сразу было понятно, от кого страница */
  .shapka{background:var(--karta);border-bottom:1px solid var(--liniya);
          padding:26px 16px 22px;text-align:center}
  .shapka img{height:74px;width:auto;display:block;margin:0 auto 16px}
  .shapka h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.01em}
  .shapka .objekt{margin-top:5px;color:var(--tusklo);font-size:15px}

  .obertka{max-width:900px;margin:0 auto;padding:22px 16px 80px}
  .svodka{color:var(--tusklo);font-size:14px;margin:0 0 18px}

  .izdelie{background:var(--karta);border:1px solid var(--liniya);border-radius:14px;
           padding:16px;margin-bottom:12px}
  .shapka-izd{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
  .kod{font-weight:650;font-size:17px}
  .nazvanie{flex:1;min-width:200px}
  .gde{color:var(--tusklo);font-size:14px}

  .pilot{display:flex;gap:12px;align-items:center;flex-wrap:wrap;
         margin-top:12px;padding-top:12px;border-top:1px solid var(--liniya)}
  .metka{font-size:12px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;
         padding:4px 9px;border-radius:6px;white-space:nowrap}
  .metka.svezhee{background:#e8f3ec;color:var(--svezhee)}
  .metka.staraya{background:#f0ede8;color:var(--tusklo)}
  .data{color:var(--tusklo);font-size:14px}
  .otkryt{margin-left:auto;padding:10px 18px;border-radius:10px;background:var(--akcent);
          color:#fff;text-decoration:none;font-size:15px;font-weight:550;white-space:nowrap}
  .otkryt.tihaya{background:transparent;color:var(--akcent);
                 border:1px solid var(--liniya);font-weight:450}
  .imya-fajla{font-size:13px;color:var(--tusklo);width:100%;word-break:break-word}

  .net{margin-top:10px;color:var(--zhdem);font-size:15px}
  .prezhnie{margin-top:6px}
  .prezhnie summary{cursor:pointer;color:var(--tusklo);font-size:14px;padding:6px 0}

  .snoska{margin-top:32px;padding:16px;background:#fff;border:1px solid var(--liniya);
          border-radius:12px;color:var(--tusklo);font-size:14px}
  .podpis{margin-top:22px;text-align:center;color:var(--tusklo);font-size:13px}

  @media(max-width:600px){
    .shapka{padding:20px 14px 18px}
    .shapka img{height:58px;margin-bottom:12px}
    .shapka h1{font-size:19px}
    .obertka{padding:18px 12px 60px}
    .otkryt{margin-left:0;width:100%;text-align:center}
  }
</style>
</head>
<body>

<div class="shapka">
  <img src="logo.png" alt="ARCHIWOOD">
  <h1>Пилоты на согласование</h1>
  <div class="objekt" id="objekt">Ильинка</div>
</div>

<div class="obertka">
  <div class="svodka" id="svodka"></div>
  <div id="spisok"></div>

  <div class="snoska">
    По каждому изделию здесь лежит самая свежая версия пилота — она отмечена зелёным.
    Прежние версии не удаляются: их можно раскрыть и сравнить.
    Страница обновляется сама, как только новый пилот выходит на согласование.
    <div style="margin-top:8px" id="obnovleno"></div>
  </div>

  <div class="podpis">ARCHIWOOD · мебель индивидуального изготовления</div>
</div>

<script>
function den(s){
  if(!s) return "";
  var d = s.slice(0,10).split("-");
  return d[2] + "." + d[1] + "." + d[0];
}

function ekran(t){
  return String(t == null ? "" : t)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function pilotHtml(p, deystvuyushchaya){
  var metka = deystvuyushchaya
      ? '<span class="metka svezhee">последняя версия</span>'
      : '<span class="metka staraya">версия ' + p.versiya + '</span>';
  var knopka = p.ssylka
      ? '<a class="otkryt' + (deystvuyushchaya ? '' : ' tihaya') + '" href="' +
        ekran(p.ssylka) + '" target="_blank" rel="noopener">Открыть</a>'
      : '<span class="data">файл готовится</span>';
  return '<div class="pilot">' + metka +
         '<span class="data">' + den(p.kogda) + '</span>' + knopka +
         '<span class="imya-fajla">' + ekran(p.fajl) + '</span></div>';
}

fetch("piloty.json?" + Date.now())
  .then(function(r){ return r.json(); })
  .then(function(d){
    var ob = d.obekty[0];
    if(!ob) return;
    document.getElementById("objekt").textContent = ob.nazvanie;
    document.getElementById("svodka").textContent =
        "Изделий: " + ob.izdeliy + " · с пилотами: " + ob.s_pilotami +
        (ob.s_pilotami === 0 ? " — работа начинается, первые пилоты появятся здесь" : "");
    document.getElementById("obnovleno").textContent = "Обновлено: " + d.obnovleno;

    document.getElementById("spisok").innerHTML = ob.izdeliya.map(function(izd){
      var vnutri = '<div class="shapka-izd">' +
          '<span class="kod">' + ekran(izd.kod) + '</span>' +
          '<span class="nazvanie">' + ekran(izd.nazvanie) + '</span>' +
          '<span class="gde">' + ekran(izd.gde) + '</span></div>';

      if(!izd.piloty.length){
        vnutri += '<div class="net">пилота пока нет</div>';
      } else {
        vnutri += pilotHtml(izd.piloty[0], true);
        if(izd.piloty.length > 1){
          vnutri += '<details class="prezhnie"><summary>прежние версии (' +
                    (izd.piloty.length - 1) + ')</summary>' +
                    izd.piloty.slice(1).map(function(p){ return pilotHtml(p, false); }).join("") +
                    '</details>';
        }
      }
      return '<div class="izdelie">' + vnutri + '</div>';
    }).join("");
  })
  .catch(function(){
    document.getElementById("spisok").innerHTML =
      '<div class="izdelie">Не удалось загрузить список. Обновите страницу.</div>';
  });
</script>
</body>
</html>
