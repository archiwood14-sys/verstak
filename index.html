<style>
  /* Тема всегда светлая — сознательное решение (28.08.2026), тёмный вариант больше не
     собирается, ни от системной настройки, ни вручную. */
  :root {
    --bg: #fbfaf7;
    --surface: #ffffff;
    --surface-2: #f1eee6;
    --ink: #262420;
    --muted: #8a8073;
    --line: #eae4d8;
    --accent: #c18048;
    --accent-ink: #ffffff;
    --ok: #4f9a6e;
    --warn: #b98424;
    --crit: #c9503f;
    --shadow: 0 1px 2px rgba(38, 36, 32, 0.04), 0 6px 20px rgba(38, 36, 32, 0.05);
    --brand-bg: #faf0e6;
    color-scheme: light;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Manrope", -apple-system, "Segoe UI", sans-serif;
    font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: "PT Mono", ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; }
  a { color: var(--accent); }
  h1, h2, h3 { text-wrap: balance; font-weight: 800; margin: 0; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  .shell {
    max-width: 640px; margin: 0 auto;
    padding: 0 16px calc(90px + env(safe-area-inset-bottom));
  }

  header.top {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--brand-bg) 94%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid color-mix(in srgb, var(--accent) 22%, transparent);
    padding: calc(12px + env(safe-area-inset-top)) 16px 11px;
  }
  header.top .row { max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
  .brand { display: flex; align-items: center; gap: 9px; margin-right: auto; cursor: pointer; }
  .brand-logo { height: 30px; width: auto; display: block; flex-shrink: 0; }
  .brand .mark {
    font-family: "Baskervville", serif; font-weight: 400; font-size: 13px;
    letter-spacing: 2.5px; text-transform: uppercase; color: var(--accent); white-space: nowrap;
  }
  .fresh-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex-shrink: 0; }
  .fresh-dot.stale { background: var(--warn); }
  #freshness { font-size: 12px; color: var(--muted); }

  main { padding-top: 18px; }

  /* ---- сегменты (объекты) ---- */
  .segs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 18px; -ms-overflow-style: none; scrollbar-width: none; }
  .segs::-webkit-scrollbar { display: none; }
  .seg {
    flex: 0 0 auto; padding: 8px 16px; border-radius: 100px; border: 1px solid var(--line);
    background: var(--surface); font-size: 14px; font-weight: 600; color: var(--muted); cursor: pointer; white-space: nowrap;
  }
  .seg.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  /* ---- поиск ---- */
  .search-wrap { position: relative; margin-bottom: 20px; }
  .search-wrap svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); }
  .search-wrap input {
    width: 100%; padding: 12px 14px 12px 38px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--surface); color: var(--ink); font-family: inherit; font-size: 15px; outline: none;
  }
  .search-wrap input:focus { border-color: var(--accent); }

  /* ---- секция ---- */
  section.blk { margin-bottom: 26px; }
  section.blk > .hd { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  section.blk > .hd h2 { font-size: 13.5px; letter-spacing: .02em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  section.blk > .hd .count { font-family: "PT Mono", monospace; font-size: 11.5px; background: var(--surface-2); border-radius: 20px; padding: 1px 8px; color: var(--ink); }

  /* ---- внимание ---- */
  .attn-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; -ms-overflow-style: none; scrollbar-width: none; }
  .attn-scroll::-webkit-scrollbar { display: none; }
  .attn-card {
    flex: 0 0 auto; width: 240px; background: var(--surface); border: 1px solid var(--line);
    border-left: 4px solid var(--crit); border-radius: 14px; padding: 13px 14px; box-shadow: var(--shadow); cursor: pointer;
  }
  .attn-card.warn { border-left-color: var(--warn); }
  .attn-card .code { font-family: "PT Mono", monospace; font-size: 11.5px; color: var(--muted); margin-bottom: 4px; }
  .attn-card .txt { font-size: 14px; font-weight: 600; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

  /* ---- сетка изделий ---- */
  .item-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (min-width: 460px) { .item-grid { grid-template-columns: repeat(3, 1fr); } }
  .item-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px 13px; box-shadow: var(--shadow); cursor: pointer; text-align: left;
    display: flex; flex-direction: column; gap: 6px; min-height: 96px;
  }
  .item-card:active { transform: scale(0.98); }
  .item-card .code { font-family: "PT Mono", monospace; font-size: 12px; color: var(--accent); font-weight: 700; }
  .item-card .nm { font-size: 13.5px; font-weight: 600; line-height: 1.3; flex: 1; }
  .item-card .room { font-size: 11.5px; color: var(--muted); }
  .item-card .flags { display: flex; gap: 5px; margin-top: 2px; }
  .flag { font-size: 10.5px; font-family: "PT Mono", monospace; padding: 1px 6px; border-radius: 8px; }
  .flag.q { background: color-mix(in srgb, var(--warn) 18%, var(--surface)); color: var(--warn); }
  .flag.r { background: color-mix(in srgb, var(--crit) 18%, var(--surface)); color: var(--crit); }

  .empty-hint { color: var(--muted); font-size: 14.5px; padding: 34px 10px; text-align: center; }

  /* ---- карточка изделия ---- */
  .back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; margin-bottom: 14px; cursor: pointer; background: none; border: none; padding: 0; font-family: inherit; }
  .back:hover { color: var(--accent); }

  .item-head { margin-bottom: 4px; }
  .item-head .code-chip { display: inline-block; font-family: "PT Mono", monospace; font-size: 12.5px; background: var(--surface-2); border-radius: 8px; padding: 3px 9px; margin-bottom: 8px; }
  .item-head h1 { font-size: 24px; line-height: 1.2; }
  .item-desc { color: var(--muted); font-size: 14.5px; margin: 6px 0 12px; }

  .pillrow { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 600; padding: 5px 12px; border-radius: 100px; border: 1px solid var(--line); background: var(--surface-2); }
  .pill.st-progress { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, var(--line)); }
  .pill.st-done { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, var(--line)); }
  .pill.link { background: var(--ink); color: var(--bg); border-color: var(--ink); text-decoration: none; }

  .params-box { background: var(--surface-2); border-radius: 12px; padding: 14px 16px; font-size: 14.5px; line-height: 1.55; margin-bottom: 18px; }
  .params-box .lbl { font-size: 11.5px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); font-weight: 700; margin-bottom: 6px; }

  .legend { font-size: 12px; color: var(--muted); margin-bottom: 18px; display: flex; gap: 14px; flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }

  details.acc { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 10px; overflow: hidden; }
  details.acc > summary {
    list-style: none; cursor: pointer; padding: 13px 15px; display: flex; align-items: center; gap: 9px;
    font-weight: 700; font-size: 14.5px;
  }
  details.acc > summary::-webkit-details-marker { display: none; }
  details.acc > summary .chev { margin-left: auto; color: var(--muted); transition: transform .15s ease; font-size: 13px; }
  details.acc[open] > summary .chev { transform: rotate(90deg); }
  details.acc > summary .cnt { font-family: "PT Mono", monospace; font-size: 11.5px; color: var(--muted); font-weight: 400; }

  .entry { padding: 11px 15px; border-top: 1px solid var(--line); display: flex; gap: 9px; align-items: flex-start; }
  .conf { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; flex-shrink: 0; }
  .conf.g { background: var(--ok); } .conf.y { background: var(--warn); } .conf.r { background: var(--crit); }
  .entry .body { flex: 1; }
  .entry .txt { font-size: 14.5px; line-height: 1.45; }
  .entry .src { font-family: "PT Mono", monospace; font-size: 11.5px; color: var(--muted); margin-top: 4px; }

  footer { text-align: center; color: var(--muted); font-size: 12px; padding-top: 34px; }
  .skeleton { color: var(--muted); padding: 70px 0; text-align: center; font-size: 14.5px; }

  /* ---- комментарий: кнопка и лист ---- */
  .fab {
    position: fixed; right: 20px; bottom: calc(22px + env(safe-area-inset-bottom)); z-index: 20;
    width: 56px; height: 56px; border-radius: 50%; border: none;
    background: var(--accent); color: var(--accent-ink); font-size: 26px;
    box-shadow: 0 6px 18px rgba(0,0,0,.18); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .fab:active { transform: scale(0.94); }

  .sheet-backdrop {
    position: fixed; inset: 0; background: rgba(20,17,12,.4); z-index: 30;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .sheet-backdrop.hidden { display: none; }
  .sheet {
    width: 100%; max-width: 640px; background: var(--surface); border-radius: 20px 20px 0 0;
    padding: 18px 18px calc(24px + env(safe-area-inset-bottom)); box-shadow: 0 -8px 30px rgba(0,0,0,.2);
  }
  .sheet h3 { font-size: 17px; margin-bottom: 12px; }
  .sheet textarea {
    width: 100%; min-height: 90px; border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 13px; font-family: inherit; font-size: 15px; color: var(--ink);
    background: var(--surface-2); resize: vertical; outline: none; margin-bottom: 10px;
  }
  .sheet textarea:focus { border-color: var(--accent); }
  .sheet .row2 { display: flex; gap: 10px; }
  .gate-backdrop {
    position: fixed; inset: 0; background: var(--bg); z-index: 100;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .gate-backdrop.hidden { display: none; }
  .gate-card {
    width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 20px; padding: 28px 24px; box-shadow: var(--shadow); text-align: center;
  }
  .gate-card .gate-logo { height: 64px; width: auto; margin: 0 auto 14px; display: block; }
  .gate-card .gate-word { font-family: "Baskervville", serif; font-weight: 400; font-size: 13px;
    letter-spacing: 3px; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }
  .gate-card p { color: var(--muted); font-size: 14px; margin: 0 0 18px; }
  .gate-card input {
    width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--surface-2); color: var(--ink); font-size: 15px; margin-bottom: 12px;
    text-align: center; letter-spacing: 1px;
  }
  .gate-card input:focus { border-color: var(--accent); outline: none; }
  .gate-card .gate-err { color: var(--crit); font-size: 13px; min-height: 18px; margin-bottom: 8px; }
  .btn {
    flex: 1; padding: 12px; border-radius: 12px; border: none; font-family: inherit;
    font-size: 14.5px; font-weight: 700; cursor: pointer;
  }
  .btn.primary { background: var(--ink); color: var(--bg); }
  .btn.ghost { background: var(--surface-2); color: var(--ink); }
  .btn.rec { background: var(--surface-2); color: var(--crit); }
  .btn.rec.active { background: var(--crit); color: #fff; }
  .btn:disabled { opacity: .5; cursor: default; }
  .sheet-status { font-size: 13px; color: var(--muted); margin-top: 10px; min-height: 18px; }
</style>

/* ---------------- CSV ---------------- */
function parseCSV(text) {
  const rows = []; let row = []; let field = ""; let inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') { if (text[i+1] === '"') { field += '"'; i++; } else { inQuotes = false; } }
      else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ""; }
      else if (c === '\r') { /* skip */ }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ""; }
      else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.length && r.some(c => c !== ""));
}

async function fetchTab(sheetId, tabName) {
  // headers=1 обязателен: без него Google иногда сам решает, что заголовка нет, и
  // склеивает все значения столбца в одну ячейку (проверено на живых данных 27.08.2026).
  const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(tabName)}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error("не читается: " + tabName);
  const rows = parseCSV(await res.text());
  if (!rows.length) return [];
  const header = rows[0];
  return rows.slice(1).map(r => {
    const obj = {};
    header.forEach((h, i) => obj[h] = r[i] || "");
    return obj;
  });
}

/* ---------------- код изделия: понимаем любое написание ---------------- */
function normCode(s) { return (s || "").toUpperCase().replace(/[\s_-]+/g, ""); }

function extractCodes(text, knownSet) {
  if (!text) return [];
  const found = new Set();
  const re = /([А-ЯЁA-Z]{1,3})[\s_-]*(\d{1,3})(?:[.\s_-]*(\d))?/gi;
  let m;
  while ((m = re.exec(text)) !== null) {
    const cand = normCode(m[1] + m[2] + (m[3] ? "." + m[3] : ""));
    if (knownSet.has(cand)) found.add(cand);
  }
  return [...found];
}

function confClass(v) {
  if (!v) return "y";
  if (v.indexOf("🟩") >= 0) return "g";
  if (v.indexOf("🟥") >= 0) return "r";
  return "y";
}
function confWord(c) { return c === "g" ? "подтверждено" : c === "r" ? "спорно" : "предложено, не проверено"; }

/* ---------------- загрузка ---------------- */
async function fetchLiveRaw() {
  const [objects, items, soglasRows] = await Promise.all([
    fetchTab(REESTR_ID, "Б1_Объекты"),
    fetchTab(REESTR_ID, "Б4_Предметы"),
    fetchTab(SOGLAS_ID, "Untitled"),
  ]);
  const blockData = {};
  for (const b of BLOCKS) blockData[b.tab] = await fetchTab(REESTR_ID, b.tab);
  return { objects, items: items.filter(it => it["Код"]), soglasRows, blockData };
}

function loadSnapshotRaw() {
  const el = document.getElementById("snapshot-data");
  if (!el) throw new Error("нет ни живых данных, ни запасного снимка");
  const d = JSON.parse(el.textContent);
  STATE.snapshotTime = d.generated;
  return { objects: d.objects, items: d.items, soglasRows: d.soglasRows, blockData: d.blockData };
}

function buildIndices(raw) {
  STATE.objects = raw.objects;
  STATE.items = raw.items;

  const soglas = {};
  raw.soglasRows.forEach(r => { if (r["Код"]) soglas[normCode(r["Код"])] = r; });
  STATE.soglas = soglas;

  const codeIndex = new Map();
  STATE.items.forEach(it => codeIndex.set(normCode(it["Код"]), it["Код"]));
  STATE.codeIndexSet = new Set(codeIndex.keys());

  STATE.blocks = raw.blockData;

  // Сегменты объектов строим по коротким именам, которыми реально помечены записи
  // (поле "Объект" в Б4/Б7-Б16) — а не по полю "Название" в Б1, оно бывает длиннее
  // ("Частный дом в КП «Медное Озеро»" против короткого "Медное Озеро" везде ниже).
  const objNames = [];
  STATE.items.forEach(it => { if (it["Объект"] && !objNames.includes(it["Объект"])) objNames.push(it["Объект"]); });
  STATE.objectNames = objNames;

  const byCode = new Map();
  for (const b of BLOCKS) {
    for (const row of raw.blockData[b.tab] || []) {
      const hay = Object.values(row).join(" | ");
      const codes = extractCodes(hay, STATE.codeIndexSet);
      for (const c of codes) {
        if (!byCode.has(c)) byCode.set(c, {});
        if (!byCode.get(c)[b.tab]) byCode.get(c)[b.tab] = [];
        byCode.get(c)[b.tab].push(row);
      }
    }
  }
  STATE.itemsByCode = byCode;

  if (!STATE.activeObj && STATE.objectNames.length) STATE.activeObj = STATE.objectNames[0];
}

async function loadAll() {
  try {
    buildIndices(await fetchLiveRaw());
    STATE.source = "live";
  } catch (e) {
    buildIndices(loadSnapshotRaw());
    STATE.source = "snapshot";
  }
}

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function itemsOfActiveObj() {
  return STATE.items.filter(it => !STATE.activeObj || it["Объект"] === STATE.activeObj);
}

    const nR = (rec["Б16_Расхождения"] || []).filter(r => (r["Разрешено ли"]||"").toLowerCase().trim() !== "да").length;

    return `<button class="item-card" data-code="${escapeHtml(code)}">
      <div class="code">${escapeHtml(code)}</div>
      <div class="nm">${escapeHtml(it["Название"] || "")}</div>
      <div class="room">${escapeHtml(it["Где стоит"] || "")}</div>
      <div class="flags">${flags.join("")}</div>

  }).join("");

  app.innerHTML = `

      <input id="search" type="text" placeholder="Найти изделие по коду или названию" autocomplete="off">

  app.querySelectorAll(".seg").forEach(el => el.addEventListener("click", () => { STATE.activeObj = el.dataset.obj; renderDashboard(); }));
  app.querySelectorAll(".item-card").forEach(el => el.addEventListener("click", () => renderItem(el.dataset.code)));
  app.querySelectorAll(".attn-card").forEach(el => { if (el.dataset.code) el.addEventListener("click", () => renderItem(el.dataset.code)); });

function filterGrid(q) {
  const norm = (q || "").trim().toLowerCase();
  document.querySelectorAll(".item-card").forEach(card => {
    const code = card.dataset.code.toLowerCase();
    const nm = card.querySelector(".nm").textContent.toLowerCase();
    const room = card.querySelector(".room").textContent.toLowerCase();
    const hit = !norm || code.includes(norm) || nm.includes(norm) || room.includes(norm);
    card.style.display = hit ? "" : "none";
  });
}

/* ---------------- рендер: карточка изделия ---------------- */
function renderItem(code) {
  const app = document.getElementById("app");
  const it = STATE.items.find(x => normCode(x["Код"]) === normCode(code));
  const rec = STATE.itemsByCode.get(normCode(code)) || {};
  const s = STATE.soglas[normCode(code)];

  if (!it && !Object.keys(rec).length) {
    app.innerHTML = `<button class="back" id="backBtn">← назад</button>
      <div class="empty-hint">Код «${escapeHtml(code)}» не нашёлся в реестре.</div>`;
    document.getElementById("backBtn").addEventListener("click", renderDashboard);
    return;
  }

  const nazvanie = it ? it["Название"] : "";
  const gde = it ? it["Где стоит"] : "";
  const opisanie = gde ? `${nazvanie ? nazvanie + ". " : ""}Стоит в помещении «${gde}».` : nazvanie;

  let pills = "";
  if (s && s["Статус"]) {
    const cls = s["Статус"].includes("Согласовано") ? "st-done" : s["Статус"].includes("Не отправлен") ? "" : "st-progress";
    pills += `<span class="pill ${cls}">${escapeHtml(s["Статус"])}${s["Дата отправки"] ? " · " + escapeHtml(s["Дата отправки"]) : ""}</span>`;
  }
  if (s && s["Ссылка на пилот"]) pills += `<a class="pill link" href="${s["Ссылка на пилот"]}" target="_blank" rel="noopener">📁 Пилот на Диске</a>`;

  let params = "";
  if (it && it["Технические параметры (из рабочего проекта)"]) {
    params = `<div class="params-box"><div class="lbl">Технические параметры</div>${escapeHtml(it["Технические параметры (из рабочего проекта)"])}</div>`;
  }

  let sections = "";
  for (const b of BLOCKS) {
    const rows = rec[b.tab];
    if (!rows || !rows.length) continue;
    const entries = rows.map(r => {
      const src = r["Источник — сообщения (ID)"] || r["Источник — файлы"]
        || (r["Вариант А — источник"] ? `${r["Вариант А — источник"]} / ${r["Вариант Б — источник"] || "?"}` : "");
      const c = confClass(r["Уверенность (🟩/🟨/🟥)"]);
      if (b.tab === "Б16_Расхождения") {
        const variants = `<div style="margin-top:6px"><b>А:</b> ${escapeHtml(r["Вариант А — значение"] || "")}
          <span class="src">(${escapeHtml(r["Вариант А — источник"] || "")})</span></div>
          <div style="margin-top:4px"><b>Б:</b> ${escapeHtml(r["Вариант Б — значение"] || "")}
          <span class="src">(${escapeHtml(r["Вариант Б — источник"] || "")})</span></div>`;
        return `<div class="entry"><span class="conf ${c}" title="${confWord(c)}"></span>
          <div class="body"><div class="txt">${escapeHtml(r[b.textCol] || "")}</div>${variants}</div></div>`;
      }
      return `<div class="entry"><span class="conf ${c}" title="${confWord(c)}"></span>
        <div class="body"><div class="txt">${escapeHtml(r[b.textCol] || "")}</div>
        ${src ? `<div class="src">${escapeHtml(src)}</div>` : ""}</div></div>`;
    }).join("");
    sections += `<details class="acc" ${b.openByDefault ? "open" : ""}>
      <summary>${b.emoji} ${b.label} <span class="cnt">${rows.length}</span><span class="chev">▸</span></summary>
      ${entries}
    </details>`;
  }

  app.innerHTML = `
    <button class="back" id="backBtn">← ко всем изделиям</button>
    <div class="item-head">
      <span class="code-chip mono">${escapeHtml(it ? it["Код"] : code)}</span>
      <h1>${escapeHtml(nazvanie || "(нет в справочнике «Предметы»)")}</h1>
    </div>
    ${gde ? `<div class="item-desc">Стоит в помещении «${escapeHtml(gde)}»${it && it["Объект"] ? " · " + escapeHtml(it["Объект"]) : ""}</div>` : ""}
    ${pills ? `<div class="pillrow">${pills}</div>` : ""}
    ${params}
    ${sections ? `<div class="legend"><span><span class="conf g" style="display:inline-block"></span>подтверждено</span><span><span class="conf y" style="display:inline-block"></span>предложено, не проверено</span><span><span class="conf r" style="display:inline-block"></span>спорно</span></div>` : ""}
    ${sections || '<div class="empty-hint">Записей по этому коду в блоках смысла пока нет.</div>'}
  `;
  document.getElementById("backBtn").addEventListener("click", renderDashboard);
}

// Развёрнут в реестре 27.08.2026.
const INBOX_URL = "https://script.google.com/macros/s/AKfycbzOiAJDQYpEbfrSioBqxFj2McrOhiAGRgLDzWTAuSEuHxvQRbDWt3YVfKddD5S4jkZueA/exec";

let mediaRecorder = null, audioChunks = [], recordedBlob = null;

function openSheet() {
  document.getElementById("sheetBackdrop").classList.remove("hidden");
  document.getElementById("sheetStatus").textContent = "";
}
function closeSheet() {
  document.getElementById("sheetBackdrop").classList.add("hidden");
  document.getElementById("commentText").value = "";
  recordedBlob = null;
  document.getElementById("recBtn").classList.remove("active");
  document.getElementById("recBtn").textContent = "🎤 Голосом";
}

async function toggleRecording() {
  const btn = document.getElementById("recBtn");
  const status = document.getElementById("sheetStatus");
  if (!mediaRecorder || mediaRecorder.state === "inactive") {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      status.textContent = "Этот браузер не даёт доступ к микрофону.";
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioChunks = [];
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.onstop = () => {
        recordedBlob = new Blob(audioChunks, { type: "audio/webm" });
        stream.getTracks().forEach(t => t.stop());
        status.textContent = "Голос записан — можно отправлять.";
      };
      mediaRecorder.start();
      btn.classList.add("active"); btn.textContent = "⏹ Стоп";
      status.textContent = "Идёт запись…";
    } catch (e) {
      status.textContent = "Не удалось включить микрофон: " + e.message;
    }
  } else {
    mediaRecorder.stop();
    btn.classList.remove("active"); btn.textContent = "🎤 Голосом";
  }
}

function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result.split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

async function sendComment() {
  const status = document.getElementById("sheetStatus");
  if (!INBOX_URL) {
    status.textContent = "Приём комментариев ещё не настроен на этой странице.";
    return;
  }
  const text = document.getElementById("commentText").value.trim();
  if (!text && !recordedBlob) { status.textContent = "Напишите текст или запишите голос."; return; }

  status.textContent = "Отправляю…";
  try {
    let payload;
    if (recordedBlob) {
      const b64 = await blobToBase64(recordedBlob);
      payload = { type: "voice", audioBase64: b64, text: text, objekt: STATE.activeObj || "" };
    } else {
      payload = { type: "text", text: text, objekt: STATE.activeObj || "" };
    }
    await fetch(INBOX_URL, { method: "POST", body: JSON.stringify(payload) });
    status.textContent = "Отправлено. Разберётся в течение часа.";
    setTimeout(closeSheet, 1200);
  } catch (e) {
    status.textContent = "Не получилось отправить: " + e.message;
  }
}

document.getElementById("fabBtn").addEventListener("click", openSheet);
document.getElementById("cancelBtn").addEventListener("click", closeSheet);
document.getElementById("recBtn").addEventListener("click", toggleRecording);
document.getElementById("sendBtn").addEventListener("click", sendComment);
document.getElementById("sheetBackdrop").addEventListener("click", e => { if (e.target.id === "sheetBackdrop") closeSheet(); });

document.getElementById("brandLink").addEventListener("click", () => renderDashboard());

  try {
    await loadAll();

    renderDashboard();

    document.getElementById("app").innerHTML =
      `<div class="empty-hint">Не удалось прочитать реестр: ${escapeHtml(String(e && e.message || e))}</div>`;
  }
})();
