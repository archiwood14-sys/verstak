<style>
:root{--fon:#faf0e6;--karta:#fff;--tekst:#262420;--tusklo:#8a7a6a;--liniya:#e9dfd5;--akcent:#c18048}

.obertka{max-width:1100px;margin:0 auto;padding:14px 16px 40px}
.verh{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
h1{font:400 26px Georgia,serif;margin:0}.meta{color:var(--tusklo);font-size:14px}
.kn{background:var(--karta);border:1px solid var(--liniya);border-radius:999px;padding:9px 18px;font:700 14px Arial;color:var(--akcent);cursor:pointer;min-height:42px}
.kn:hover{background:var(--akcent);color:#fff}
.scena{background:var(--karta);border:1px solid var(--liniya);border-radius:16px;margin:14px 0;padding:10px;text-align:center}
.scena img{max-width:100%;height:auto;max-height:76vh}
.lenta{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:6px}
.lenta button{background:var(--karta);border:1px solid var(--liniya);border-radius:10px;padding:6px 4px;font:13px Arial;cursor:pointer}
.lenta button.tek{background:var(--akcent);color:#fff;border-color:var(--akcent)}

<div class="verh"><div><h1 id="marka"></h1><div class="meta" id="meta"></div></div>
<div><button class="kn" id="nazad">← назад</button> <button class="kn" id="vpered">вперёд →</button></div></div>
