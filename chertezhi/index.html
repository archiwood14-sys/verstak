<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Чертежи — ARCHIWOOD</title>
<link rel="icon" href="../piloty/logo.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{--fon:#f6f5f3;--karta:#fff;--tekst:#1c1a17;--tusklo:#6b665e;--liniya:#e6e1d9;
        --akcent:#b98a52;--horosho:#2f7d4f;--sinij:#3c5a8a;--zhdem:#a59f95;--vopros:#8a5f1c}
  *{box-sizing:border-box}
  body{margin:0;background:var(--fon);color:var(--tekst);
       font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       -webkit-text-size-adjust:100%}
  button{font:inherit;color:inherit}

  /* шапка — простая: знак, слово, объект */
  .shapka{padding:28px 16px 6px;text-align:center}
  .shapka img{height:58px;display:block;margin:0 auto 14px}
  .shapka h1{margin:0;font-size:24px;font-weight:600;letter-spacing:-.01em}
  .shapka .objekt{margin-top:3px;color:var(--tusklo);font-size:16px}

  .obertka{max-width:960px;margin:0 auto;padding:18px 16px 90px}

  /* вход */
  .vhod{max-width:380px;margin:30px auto;background:var(--karta);border:1px solid var(--liniya);
        border-radius:16px;padding:22px}
  .vhod input{width:100%;padding:12px 13px;font-size:17px;border:1px solid var(--liniya);
              border-radius:10px;margin:12px 0}
  .vhod button{width:100%;padding:12px;border:0;border-radius:10px;background:var(--tekst);
               color:#fff;font-size:16px;cursor:pointer}
  .vhod .podskaz{font-size:14px;color:var(--tusklo);margin-top:6px}
  .vhod .oshibka{color:#a4442f;font-size:14px;min-height:20px;margin-top:8px}

  /* плитки-фильтры */
  .plitki{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:4px 0 16px}
  .plitka{background:var(--karta);border:1px solid var(--liniya);border-radius:14px;
          padding:13px 12px 11px;cursor:pointer;text-align:left;transition:border-color .15s,box-shadow .15s}
  .plitka b{display:block;font-size:26px;font-weight:650;letter-spacing:-.02em;line-height:1.1}
  .plitka span{display:block;font-size:13px;color:var(--tusklo);margin-top:3px;line-height:1.25}
  .plitka.vybrana{border-color:var(--tekst);box-shadow:0 0 0 1px var(--tekst)}
  .plitka.soglasovanie b{color:var(--sinij)}
  .plitka.voprosy b{color:var(--vopros)}
  .plitka.net b{color:var(--zhdem)}
  @media(max-width:700px){
    .plitki{grid-template-columns:repeat(2,1fr)}
    .plitka.vse{grid-column:1 / -1}
  }

  .poisk{width:100%;padding:11px 13px;font-size:16px;border:1px solid var(--liniya);
         border-radius:12px;margin-bottom:14px;background:var(--karta)}

  .kartochka{background:var(--karta);border:1px solid var(--liniya);border-radius:16px;
             padding:16px;margin-bottom:12px}
  .k-verh{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
  .kod{font-weight:650;font-size:17px;white-space:nowrap}
  .nazv{flex:1;min-width:200px}
  .nazv div{line-height:1.4}
  .gde{color:var(--tusklo);font-size:14px;margin-top:2px}
  .status{font-size:12px;font-weight:600;letter-spacing:.02em;padding:5px 9px;border-radius:7px;white-space:nowrap}
  .status.soglasovanie{background:#eef1f8;color:var(--sinij)}
  .status.rabota{background:#f1eee8;color:var(--tusklo)}

  .pachka{margin-top:14px;padding-top:14px;border-top:1px solid var(--liniya)}
  .p-verh{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:10px;font-size:14px}
  .metka{font-size:11.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;
         padding:4px 8px;border-radius:6px}
  .metka.svezhee{background:#e8f3ec;color:var(--horosho)}
  .metka.staraya{background:#f0ede8;color:var(--tusklo)}
  .data{color:var(--tusklo)}

  .fajly{display:flex;gap:9px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
  .fajl{flex:0 0 auto;width:136px;border:1px solid var(--liniya);border-radius:11px;overflow:hidden;
        background:#faf8f5;cursor:pointer;padding:0;text-align:left}
  .fajl .mini{width:100%;height:98px;object-fit:cover;display:block;background:#efece7}
  .fajl .zaglushka{height:98px;display:flex;align-items:center;justify-content:center;
                   color:var(--tusklo);font-size:13px;background:#efece7}
  .fajl .podpis{font-size:11.5px;color:var(--tusklo);padding:5px 7px;line-height:1.3;
                display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .fajl .tip{font-weight:600;color:var(--akcent)}

  .voprosy{margin-top:12px;background:#fbf6ee;border-radius:11px;padding:11px 13px}
  .voprosy h3{margin:0 0 6px;font-size:14px;font-weight:600;color:var(--vopros)}
  .voprosy .gruppa{font-size:13px;font-weight:600;color:var(--tusklo);margin:8px 0 2px}
  .voprosy ol{margin:0;padding-left:20px;font-size:14.5px}
  .voprosy li{margin:3px 0}

  .net-spisok{background:var(--karta);border:1px solid var(--liniya);border-radius:16px;padding:6px 16px}
  .net-stroka{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--liniya);align-items:baseline;flex-wrap:wrap}
  .net-stroka:last-child{border-bottom:0}
  .net-stroka .kod{min-width:74px}
  .net-poyasn{color:var(--tusklo);font-size:14px;margin:0 0 10px}

  /* просмотр */
  .smotr{position:fixed;inset:0;background:#16140f;z-index:50;display:none;flex-direction:column}
  .smotr.vidno{display:flex}
  .smotr-verh,.smotr-niz{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;
                         color:#eee6da;font-size:14px;background:#1f1c16}
  .smotr-verh .imya{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .smotr button,.smotr a{background:rgba(255,255,255,.13);color:#fff;border:0;border-radius:9px;
                         padding:9px 14px;font-size:15px;cursor:pointer;text-decoration:none;white-space:nowrap}
  .smotr .skachat{background:var(--akcent)}
  .polotno{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;text-align:center;padding:12px 0}
  .polotno canvas,.polotno img{display:block;margin:0 auto 12px;background:#fff;max-width:none}
  .zagruzka{color:#cfc7ba;padding:40px 10px}

  .podval{margin-top:26px;text-align:center;color:var(--tusklo);font-size:13px}
  @media(max-width:600px){.obertka{padding:14px 11px 70px}.shapka img{height:48px}.shapka h1{font-size:21px}}
</style>
</head>
<body>

<div class="smotr" id="smotr">
  <div class="smotr-verh">
    <span class="imya" id="sm-imya"></span>
    <span id="sm-schet"></span>
    <button onclick="zakryt()">Закрыть ✕</button>
  </div>
  <div class="polotno" id="polotno"></div>
  <div class="smotr-niz">
    <button onclick="listat(-1)">← Файл</button>
    <button onclick="listat(1)">Файл →</button>
    <button onclick="masshtab(0.8)">−</button>
    <button onclick="masshtab(1.25)">+</button>
    <button onclick="poShirine()">По ширине</button>
    <a class="skachat" id="sm-skachat" href="#" download>Скачать</a>
  </div>
</div>

<div class="shapka">
  <img src="../piloty/logo.png" alt="ARCHIWOOD">
  <h1>Чертежи</h1>
  <div class="objekt" id="objekt">&nbsp;</div>
</div>

<div class="obertka">
  <div id="vhod" class="vhod">
    <div>Чертежи защищены паролем — это частный дом заказчика.</div>
    <div class="podskaz">Можно вставить весь текст сообщения с паролем — страница сама его найдёт.</div>
    <input id="parol" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
           placeholder="Пароль" onkeydown="if(event.key==='Enter')voyti()">
    <button onclick="voyti()">Открыть</button>
    <div class="oshibka" id="oshibka"></div>
  </div>

  <div id="soderzhanie" hidden>
    <div class="plitki" id="plitki"></div>
    <input class="poisk" id="poisk" placeholder="Найти изделие: код, название, помещение" oninput="narisovat()">
    <div id="spisok"></div>
    <div class="podval" id="podval"></div>
  </div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const OB = new URLSearchParams(location.search).get("ob") || "mednoe";
const PAPKA = OB + "/";
let KLYUCH = null, D = null, FILTR = "vse";
const RASSHIFROVANO = new Map();
const SM = { spisok: [], nomer: 0, masshtab: 1, pdf: null, url: null };

function ekran(t){
  return String(t == null ? "" : t).replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function den(s){ if(!s) return ""; const d = s.slice(0,10).split("-"); return d[2]+"."+d[1]+"."+d[0]; }

/* ---------- ключ и расшифровка ---------- */
async function vyvestiKlyuch(parol, salt, iter){
  const baza = await crypto.subtle.importKey("raw", new TextEncoder().encode(parol), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations: iter, hash:"SHA-256"},
    baza, {name:"AES-GCM", length:256}, false, ["decrypt"]);
}
async function rasshifrovat(buf){
  const u = new Uint8Array(buf);
  return crypto.subtle.decrypt({name:"AES-GCM", iv: u.slice(0,12)}, KLYUCH, u.slice(12));
}
async function fajlBin(imya){
  if(RASSHIFROVANO.has(imya)) return RASSHIFROVANO.get(imya);
  const r = await fetch(PAPKA + "f/" + imya);
  if(!r.ok) throw new Error("файл не найден");
  const b = await rasshifrovat(await r.arrayBuffer());
  RASSHIFROVANO.set(imya, b);
  return b;
}

function izRusskoyRaskladki(s){
  const ru = "йцукенгшщзхъфывапролджэячсмитьбю", en = "qwertyuiop[]asdfghjkl;'zxcvbnm,.";
  return s.split("").map(ch => { const i = ru.indexOf(ch.toLowerCase()); return i >= 0 ? en[i] : ch; }).join("");
}

/* Телефон портит вставку: прихватывает «Пароль:» и соседние строки, меняет дефис
   на длинное тире, вставляет невидимые знаки. Чистим и находим сам пароль. */
function ochistit(s){
  s = String(s || "").normalize("NFKC");
  s = s.replace(/[\u2010-\u2015\u2212\uFE58\uFE63\uFF0D]/g, "-");
  s = s.replace(/[\u00A0\u200B-\u200D\u2060\uFEFF]/g, " ");
  const m = s.match(/[A-Za-zА-Яа-яЁё]+\s*-\s*[A-Za-zА-Яа-яЁё]+\s*-\s*\d{4}/);
  return (m ? m[0] : s).replace(/\s+/g, "").trim();
}

async function voyti(zapomnennyy){
  const oshibka = document.getElementById("oshibka");
  const vvod = ochistit(zapomnennyy || document.getElementById("parol").value);
  if(!vvod) return;
  oshibka.textContent = "Проверяю…";
  try{
    const meta = await (await fetch(PAPKA + "meta.json?" + Date.now())).json();
    const salt = Uint8Array.from(atob(meta.salt), c => c.charCodeAt(0));
    const shifr = await (await fetch(PAPKA + "spisok.bin?" + Date.now())).arrayBuffer();
    for(const p of [vvod, vvod.toLowerCase(), izRusskoyRaskladki(vvod)]){
      try{
        KLYUCH = await vyvestiKlyuch(p, salt, meta.iter);
        const u = new Uint8Array(shifr);
        const otkr = await crypto.subtle.decrypt({name:"AES-GCM", iv: u.slice(0,12)}, KLYUCH, u.slice(12));
        D = JSON.parse(new TextDecoder().decode(otkr));
        try{ localStorage.setItem("chertezhi_" + OB, p); }catch(e){}
        document.getElementById("vhod").hidden = true;
        document.getElementById("soderzhanie").hidden = false;
        pokazat();
        return;
      }catch(e){ KLYUCH = null; }
    }
    oshibka.textContent = zapomnennyy ? "" : "Пароль не подошёл.";
  }catch(e){
    oshibka.textContent = "Не удалось загрузить: " + e.message;
  }
}

/* ---------- плитки и список ---------- */
const PLITKI = [
  ["vse",          "Все чертежи"],
  ["soglasovanie", "На согласовании"],
  ["rabota",       "Готовятся к согласованию"],
  ["voprosy",      "С открытыми вопросами"],
  ["net",          "Без чертежей"],
];

function pokazat(){
  document.getElementById("objekt").textContent = D.obekt;
  document.getElementById("podval").textContent = D.posledniy_chertezh
    ? "Последний чертёж получен " + den(D.posledniy_chertezh) : "";
  narisovat();
}

function narisovatPlitki(){
  document.getElementById("plitki").innerHTML = PLITKI.map(([k, nazv]) =>
    '<button class="plitka ' + k + (FILTR === k ? ' vybrana' : '') + '" onclick="vybrat(\'' + k + '\')">' +
    '<b>' + (D.schet[k] || 0) + '</b><span>' + nazv + '</span></button>').join("");
}

function vybrat(k){ FILTR = k; narisovat(); window.scrollTo({top: document.getElementById("plitki").offsetTop - 10, behavior: "smooth"}); }

function podhodit(k){
  if(FILTR === "vse") return k.status !== "net";
  if(FILTR === "voprosy") return k.s_voprosami;
  return k.status === FILTR;
}

function narisovat(){
  narisovatPlitki();
  const q = (document.getElementById("poisk").value || "").toLowerCase().trim();
  const iskomoe = k => !q || (k.podpis_kodov + " " + k.nazvaniya.join(" ") + " " + k.gde).toLowerCase().includes(q);
  const vidno = D.kartochki.filter(k => podhodit(k) && iskomoe(k));
  const spisok = document.getElementById("spisok");

  if(FILTR === "net"){
    spisok.innerHTML = vidno.length
      ? '<p class="net-poyasn">По этим изделиям чертежи ещё не готовились.</p><div class="net-spisok">' +
        vidno.map(k => '<div class="net-stroka"><span class="kod">' + ekran(k.podpis_kodov) + '</span>' +
          '<span class="nazv">' + ekran(k.nazvaniya.join(" + ")) + '<div class="gde">' + ekran(k.gde) + '</div></span></div>').join("") +
        '</div>'
      : '<div class="kartochka">Ничего не нашлось.</div>';
  } else {
    spisok.innerHTML = vidno.map(kartochka).join("") || '<div class="kartochka">Ничего не нашлось.</div>';
  }
  zagruzitMiniatyury();
}

function kartochka(k){
  const status = k.status === "soglasovanie"
    ? '<span class="status soglasovanie">на согласовании с ' + den(k.pachki[0].u_zakazchika) + '</span>'
    : '<span class="status rabota">готовится к согласованию</span>';
  let v = '<div class="kartochka"><div class="k-verh">' +
    (k.podpis_kodov ? '<span class="kod">' + ekran(k.podpis_kodov) + '</span>' : '') +
    '<span class="nazv">' + k.nazvaniya.map(n => '<div>' + ekran(n) + '</div>').join("") +
    (k.gde ? '<div class="gde">' + ekran(k.gde) + '</div>' : '') + '</span>' + status + '</div>';
  k.pachki.forEach((p, n) => { v += pachka(p, n === 0, k.pachki.length > 1); });
  return v + '</div>';
}

function pachka(p, svezhaya, neskolko){
  let v = '<div class="pachka"><div class="p-verh">' +
    (neskolko ? (svezhaya ? '<span class="metka svezhee">последняя версия</span>'
                          : '<span class="metka staraya">прежняя версия</span>') : '') +
    '<span class="data">' + den(p.kogda) + '</span></div>';

  v += '<div class="fajly">' + p.fajly.map((f, i) => {
    if(f.net_fajla) return '<div class="fajl"><div class="zaglushka">нет файла</div><div class="podpis">' + ekran(f.imya) + '</div></div>';
    return '<button class="fajl" onclick="otkryt(\'' + ekran(p.id) + '\',' + i + ')">' +
      (f.mini ? '<img class="mini" data-mini="' + ekran(f.mini) + '" alt="">' : '<div class="zaglushka">' + (f.tip === "pdf" ? "PDF" : "файл") + '</div>') +
      '<div class="podpis"><span class="tip">' + (f.tip === "pdf" ? "Чертёж" : "Вид") + '</span> · ' + ekran(f.imya) + '</div></button>';
  }).join("") + '</div>';

  if(svezhaya && p.voprosy && p.voprosy.length){
    v += '<div class="voprosy"><h3>Открытые вопросы по чертежу</h3>' +
      p.voprosy.map(g => (g.gruppa ? '<div class="gruppa">' + ekran(g.gruppa) + '</div>' : '') +
        '<ol>' + g.punkty.map(t => '<li>' + ekran(t) + '</li>').join("") + '</ol>').join("") +
      '</div>';
  }
  return v + '</div>';
}

function vsePachki(){
  const vse = [];
  D.kartochki.forEach(k => k.pachki.forEach(p => { if(!vse.find(x => x.id === p.id)) vse.push(p); }));
  return vse;
}

/* ---------- миниатюры: расшифровываем, только когда видны ---------- */
let nablyudatel = null;
function zagruzitMiniatyury(){
  if(nablyudatel) nablyudatel.disconnect();
  nablyudatel = new IntersectionObserver(zapisi => {
    zapisi.forEach(async z => {
      if(!z.isIntersecting) return;
      const img = z.target; nablyudatel.unobserve(img);
      try{
        const b = await fajlBin(img.dataset.mini);
        img.src = URL.createObjectURL(new Blob([b], {type:"image/jpeg"}));
      }catch(e){}
    });
  }, {rootMargin:"200px"});
  document.querySelectorAll("img[data-mini]").forEach(i => nablyudatel.observe(i));
}

/* ---------- просмотр ---------- */
function otkryt(idPachki, nomer){
  const p = vsePachki().find(x => x.id === idPachki);
  if(!p) return;
  SM.spisok = p.fajly.filter(f => !f.net_fajla);
  SM.nomer = Math.max(0, SM.spisok.indexOf(p.fajly[nomer]));
  document.getElementById("smotr").classList.add("vidno");
  document.body.style.overflow = "hidden";
  pokazatFajl();
}

async function pokazatFajl(){
  const f = SM.spisok[SM.nomer];
  const polotno = document.getElementById("polotno");
  document.getElementById("sm-imya").textContent = f.imya;
  document.getElementById("sm-schet").textContent = (SM.nomer + 1) + " из " + SM.spisok.length;
  polotno.innerHTML = '<div class="zagruzka">Открываю…</div>';
  SM.pdf = null; SM.masshtab = 1;
  if(SM.url){ URL.revokeObjectURL(SM.url); SM.url = null; }
  try{
    const b = await fajlBin(f.bin);
    const tip = f.tip === "pdf" ? "application/pdf" : "image/jpeg";
    SM.url = URL.createObjectURL(new Blob([b], {type: tip}));
    const skachat = document.getElementById("sm-skachat");
    skachat.href = SM.url; skachat.setAttribute("download", f.imya);
    if(f.tip === "pdf"){
      SM.pdf = await pdfjsLib.getDocument({data: new Uint8Array(b.slice(0))}).promise;
      await poShirine();
    } else {
      polotno.innerHTML = '<img id="sm-img" src="' + SM.url + '" alt="">';
      document.getElementById("sm-img").onload = () => poShirine();
    }
  }catch(e){
    polotno.innerHTML = '<div class="zagruzka">Не удалось открыть: ' + ekran(e.message) + '</div>';
  }
}

async function narisovatPdf(){
  const polotno = document.getElementById("polotno");
  const dpr = window.devicePixelRatio || 1;
  polotno.innerHTML = "";
  for(let n = 1; n <= SM.pdf.numPages; n++){
    const str = await SM.pdf.getPage(n);
    const vp = str.getViewport({scale: SM.masshtab});
    const c = document.createElement("canvas");
    c.width = Math.floor(vp.width * dpr); c.height = Math.floor(vp.height * dpr);
    c.style.width = Math.floor(vp.width) + "px"; c.style.height = Math.floor(vp.height) + "px";
    polotno.appendChild(c);
    await str.render({canvasContext: c.getContext("2d"), viewport: str.getViewport({scale: SM.masshtab * dpr})}).promise;
  }
}

async function poShirine(){
  const polotno = document.getElementById("polotno");
  const shirina = polotno.clientWidth - 16;
  if(SM.pdf){
    const str = await SM.pdf.getPage(1);
    SM.masshtab = shirina / str.getViewport({scale:1}).width;
    await narisovatPdf();
  } else {
    const img = document.getElementById("sm-img");
    if(img){ img.style.width = shirina + "px"; SM.masshtab = 1; }
  }
}

async function masshtab(k){
  if(SM.pdf){
    SM.masshtab = Math.min(8, Math.max(0.2, SM.masshtab * k));
    await narisovatPdf();
  } else {
    const img = document.getElementById("sm-img");
    if(img){ img.style.width = Math.max(120, img.clientWidth * k) + "px"; }
  }
}

function listat(kuda){
  const n = SM.nomer + kuda;
  if(n < 0 || n >= SM.spisok.length) return;
  SM.nomer = n; pokazatFajl();
}
function zakryt(){
  document.getElementById("smotr").classList.remove("vidno");
  document.body.style.overflow = "";
  document.getElementById("polotno").innerHTML = "";
}
document.addEventListener("keydown", e => {
  if(!document.getElementById("smotr").classList.contains("vidno")) return;
  if(e.key === "Escape") zakryt();
  if(e.key === "ArrowLeft") listat(-1);
  if(e.key === "ArrowRight") listat(1);
});

try{ const z = localStorage.getItem("chertezhi_" + OB); if(z) voyti(z); }catch(e){}
</script>
