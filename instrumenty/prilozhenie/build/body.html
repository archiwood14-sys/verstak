 const counts={today:waitsMe().length,inbox:inboxNew(),decisions:XD.filter(x=>x.p&&!x.closed).length};
 document.getElementById('side').innerHTML=`
  <button class="brand" data-act="go" data-v="today"><b>АРХИВУД</b><span>Проекты</span></button>
  <button class="kbtn" data-act="pal">${I.search}<span>Найти документ</span><kbd>Ctrl K</kbd></button>
  <nav class="menu" aria-label="Разделы">${NAV.map(x=>`<button data-act="go" data-v="${x.v}" aria-current="${on===x.v}">${I[x.i]}${x.n}${counts[x.v]?`<span class="cnt ${x.v==='decisions'?'hot':''}">${counts[x.v]}</span>`:''}</button>`).join('')}</nav>
  <div class="side-h">Проекты</div>
  <nav class="menu plist">${PROJECTS.map(p=>`<button data-act="proj" data-p="${p.id}" aria-current="${(S.view==='project'||S.view==='doc')&&S.pid===p.id}"><span class="dot ${projRed(p.id)?'r':'c'}"></span>${esc(p.name)}</button>`).join('')}
   ${['drugie','obshchee'].map(k=>`<button data-act="proj" data-p="${k}" aria-current="${(S.view==='project'||S.view==='doc')&&S.pid===k}"><span class="dot"></span>${PRJ[k].name}<span class="cnt">${DOCS.filter(d=>d.p===k&&d.st!=='old').length}</span></button>`).join('')}</nav>
  <div class="side-h">Демо</div>
  <nav class="menu"><button data-act="go" data-v="bot" aria-current="${S.view==='bot'}">${I.tg}Telegram-бот</button></nav>
  <div class="side-foot"><div class="xs muted" style="padding:0 6px">Каталог Диска: ${RAW.nfiles} файлов, обновлён ${latestLabel()}</div><div class="me"><span class="ava">${TEAM[S.me].s}</span><label for="meSel" class="sr">Кто я</label><select id="meSel" data-ch="me">${Object.entries(TEAM).map(([k,t])=>`<option value="${k}" ${k===S.me?'selected':''}>${t.n}</option>`).join('')}</select>
   <button class="iconbtn" data-act="theme" aria-label="Сменить тему">${isDark()?I.sun:I.moon}</button></div></div>`;
 document.getElementById('mtop').innerHTML=`<button class="brand" data-act="go" data-v="today"><b>АРХИВУД</b></button><span class="sp"></span>
  <label for="meSelM" class="sr">Кто я</label><select id="meSelM" data-ch="me" style="max-width:128px;font-size:12.5px">${Object.entries(TEAM).map(([k,t])=>`<option value="${k}" ${k===S.me?'selected':''}>${t.n}</option>`).join('')}</select>
  <button class="iconbtn" data-act="pal" aria-label="Найти">${I.search}</button><button class="iconbtn" data-act="theme" aria-label="Сменить тему">${isDark()?I.sun:I.moon}</button>`;
 document.getElementById('bnav').innerHTML=[NAV[0],NAV[1],NAV[2],NAV[3],NAV[5]].map(x=>`<button data-act="go" data-v="${x.v}" aria-current="${on===x.v}">${I[x.i]}<span>${x.m||x.n}</span></button>`).join('');
}
function setHash(){let h=S.view;if(S.view==='project')h='project-'+S.pid;if(S.view==='doc')h='doc-'+S.did;try{if(location.hash!=='#'+h)history.replaceState(null,'','#'+h);}catch(e){}}
function go(v,o){Object.assign(S,o||{});S.view=v;if(v==='doc'){S.docView=null;S.cmpA=null;S.cmpB=null;}setHash();render();window.scrollTo(0,0);}
function fromHash(){const h=location.hash.slice(1);if(!h)return;
 if(h.startsWith('project-')){const p=h.slice(8);if(PRJ[p]){S.view='project';S.pid=p;S.ptab=PRJ[p].docsOnly?'docs':'over';}return;}
 if(h.startsWith('doc-')){const d=DOC(h.slice(4));if(d){S.view='doc';S.did=d.id;S.pid=d.p;}return;}
 if(NAV.some(n=>n.v===h)||h==='bot')S.view=h;}
let toastT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3400);}
function crumbs(a){return `<nav class="crumbs" aria-label="Путь">${a.map((x,i)=>i<a.length-1?`<button data-act="${x.act||'go'}" ${x.v?`data-v="${x.v}"`:''} ${x.p?`data-p="${x.p}"`:''} ${x.tab?`data-tab="${x.tab}"`:''}>${esc(x.n)}</button><span>/</span>`:`<span>${esc(x.n)}</span>`).join('')}</nav>`;}
const docLink=(id,lbl)=>{const d=id!=null?DOC(id):null;return d?`<button class="link" data-act="doc" data-id="${d.id}">${esc(lbl||d.n)} · ред. ${cur(d).r}</button>`:'';};

/* ============ 1. СЕГОДНЯ ============ */
function qRow(q,mode){
 const d=q.docId!=null?DOC(q.docId):null;
 const late=mode==='wait'&&q.days>5;
 return `<div class="wt"><div><div class="t">${esc(q.t)}</div></div>
  <div class="days ${late?'r':''}">${q.days}<small>${plural(q.days,'день','дня','дней')}</small></div>
  <div class="m"><b style="color:var(--ink2)">${esc(PRJ[q.p].name)}</b>${mode==='wait'?`<span>ждём: <span class="who">${esc(q.from)}</span></span>`:`<span>с ${sd(q.since)}</span>`}${q.due?`<span class="flag w">срок ${sd(q.due)}</span>`:''}${q.aff?`<span>влияет: ${esc(q.aff)}</span>`:''}
   <span class="src">источник: ${esc(q.src)}</span>${d?docLink(d.id):''}
   ${mode==='wait'?`<button class="btn sm" data-act="remind" data-id="${q.id}">Напомнить</button>`:q.act==='compose-pay'?`<button class="btn sm pri" data-act="composePay">Собрать уведомление</button>`:q.act==='decisions'?`<button class="btn sm" data-act="go" data-v="decisions">Открыть решения</button>`:''}${mode!=='wait'?`<button class="btn sm" data-act="done" data-id="${q.id}">Готово</button>`:''}</div></div>`;
}

  <span class="fresh">данные: каталог Диска ${latestLabel()} · ${journalFresh('raz_dveri')}</span></div>
 <div class="grid2"><div class="stack">
  <section class="card"><div class="card-h"><h2>Ждут меня</h2><span class="small muted">${wm.length}</span></div>${wm.map(q=>qRow(q,'me')).join('')||'<p class="empty">Ничего не ждёт.</p>'}</section>
  <section class="card"><div class="card-h"><h2>${S.me==='im'?'Мы ждём':'Я жду'}</h2><span class="small muted">красным — больше 5 дней</span></div>${iw.map(q=>qRow(q,'wait')).join('')||'<p class="empty">Вы никого не ждёте.</p>'}</section>
 </div><div class="stack">
  <section class="card"><div class="card-h"><h2>Деньги</h2><button class="link small" data-act="proj" data-p="raz_dveri" data-tab="money">Договор и деньги</button></div>
   <div class="tw"><table><tbody>${money.map(x=>`<tr><td><b>${esc(PRJ[x.p].name)}</b><div class="sub">${x.n}-й платёж · ${esc(x.t)}</div></td><td class="r"><b>${money_(x.sum)}</b><div class="sub">${x.agreed?`срок ${sd(x.due)} / ${sd(x.agreed)}`:'срок '+sd(x.due)}</div><div style="margin-top:3px">${payChip(x)}</div></td></tr>`).join('')}</tbody></table></div>
   <div class="sumcheck" style="color:var(--muted)">Получено по Раздорам: ${money_(projPaid('raz_dveri'))} из ${money_(PRJ.raz_dveri.sum)}. По Олимпийскому — аванс после подписания.</div></section>
  <section class="card"><div class="card-h"><h2>Новое со вчера</h2><button class="link small" data-act="go" data-v="inbox">Входящие · ${inboxNew()}</button></div>
   <ul class="feed">${nw.map(x=>{const d=x.d,v=cur(d);return `<li><span class="ic">${srcKind(v.src)==='tg'?I.tg:I.mail}</span><span class="tx"><button class="dn" data-act="doc" data-id="${d.id}">${esc(d.n)}</button></span><span class="mt">${esc(v.src)} · ${sd(v.d)} ${v.t} · предложено: ${esc(PRJ[d.p].name)} → ${esc(secName(d.sec))}</span></li>`;}).join('')}</ul></section>
  <section class="card"><div class="card-h"><h2>Ближайшие даты</h2></div><ul class="feed">${dates.map(x=>{const n=days(TODAY,pd(x.d));return `<li><span class="ic ${x.done?'ok':''}">${x.done?I.ok:I.today}</span><span class="tx">${esc(x.t)}</span><span class="mt">${sd(x.d)} · ${n===0?'сегодня':'через '+dn(n)} · ${esc(PRJ[x.p].name)}</span></li>`;}).join('')}</ul></section>
 </div></div>`;
}
const money_=n=>money(n);

/* ============ 2. ПОРТФЕЛЬ ============ */

 return `<div class="ph"><div><div class="eyebrow">${PROJECTS.length} проекта в работе</div><h1>Портфель</h1><p>Одна строка на проект: где мы, деньги, договор, главный риск и кого ждём. Красная полоса — ждём больше 5 дней или есть просроченный платёж.</p></div>
  <span class="fresh">${latestLabel()} · каталог Диска и журналы проектов</span></div>
 <section class="card pf"><div class="pf-row pf-h"><span>Проект</span><span>Получено / сумма</span><span>Договор</span><span>Ждём от</span><span>Главный риск</span></div>
 ${PROJECTS.map(p=>{const paid=projPaid(p.id);const w=openQ().filter(q=>q.p===p.id&&q.kind==='ext').sort((a,b)=>b.days-a.days);

   <span><span class="lab">Договор</span><span class="v"><b>${esc(p.contract.st)}</b></span><span class="l2" style="display:block">${esc(p.contract.who)}</span></span>
   <span><span class="lab">Ждём от</span>${w.slice(0,2).map(q=>`<span class="v" style="display:block">${esc(q.from)} — <b style="color:${q.days>5?'var(--bad)':'var(--copper-ink)'}">${q.days} дн.</b></span><span class="l2" style="display:block">${esc(q.t)}</span>`).join('')||'<span class="l2">никого</span>'}</span>
   <span class="risk"><span class="lab">Главный риск</span><span class="v">${esc(p.risk)}</span></span></button>`;}).join('')}

 <p class="small muted" style="margin-top:12px">Другие объекты (Плющиха, Озерки, Ильинка, Медное Озеро) — только документы, текущей работы в журналах нет: <button class="link" data-act="proj" data-p="drugie">открыть документы</button>.</p>`;

/* ============ 3. ПРОЕКТ ============ */
const PTABS=[['over','Обзор'],['pos','Позиции'],['docs','Документы'],['money','Договор и деньги'],['qd','Вопросы и решения'],['log','Журнал']];
function vProject(){
 const p=PRJ[S.pid];
 if(p.docsOnly){S.ptab='docs';return crumbs([{v:'portfolio',n:'Портфель'},{n:p.name}])+`<div class="ph"><div><h1>${esc(p.name)}</h1><p>${esc(p.what)}</p></div><span class="fresh">${latestLabel()} · каталог Диска</span></div>`+registry(p);}
 const nd=DOCS.filter(d=>d.p===p.id&&d.sec!=='Переписка'&&d.st!=='old').length;
 const nq=openQ().filter(q=>q.p===p.id).length+XD.filter(x=>x.p===p.id&&!x.closed).length;
 const tabs=`<div class="tabs" role="tablist">${PTABS.map(([k,n])=>`<button role="tab" data-act="ptab" data-t="${k}" aria-current="${S.ptab===k}">${n}${k==='docs'?`<span class="c">${nd}</span>`:k==='qd'?`<span class="c">${nq}</span>`:k==='pos'?`<span class="c">${POS[p.id].items.length}</span>`:''}</button>`).join('')}</div>`;
 const B={over:pOverview,pos:pPositions,docs:registry,money:pMoney,qd:p2=>qdView(p2.id),log:journal}[S.ptab]||pOverview;
 return crumbs([{v:'portfolio',n:'Портфель'},{n:p.name}])+pHead(p)+tabs+B(p);
}

 const paid=projPaid(p.id);
 return `<div class="phead"><div><div class="eyebrow">${esc(p.type)}${p.contractNo?' · договор '+esc(p.contractNo):''}</div><h1>${esc(p.name)}</h1>
  <p class="muted" style="margin:6px 0 0">${esc(p.what)}</p>
  <dl class="facts">
   <div><dt>Сумма</dt><dd class="tnum"><b>${money(p.sum)}</b></dd></div>
   <div><dt>Получено</dt><dd class="tnum">${PAY.some(x=>x.p===p.id)?money(paid)+' · '+Math.round(paid/p.sum*100)+' %':'<span class="nodata">нет в данных</span>'}</dd></div>
   <div><dt>Заказчик</dt><dd>${esc(p.client)}</dd></div>
   <div><dt>Наша сторона</dt><dd>${esc(p.ours)}</dd></div>
   <div><dt>Дизайнер</dt><dd>${esc(p.designer)}</dd></div>
   <div><dt>Люди заказчика</dt><dd>${esc(p.people)}</dd></div>
   <div><dt>Подрядчики</dt><dd>${esc(p.subs)}</dd></div>
   <div><dt>Как менялась цена</dt><dd>${esc(p.sumHist)}</dd></div></dl></div>
  <div class="ballbox"><span class="eyebrow">Договор</span><b>${esc(p.contract.st)}</b><span class="w">${esc(p.contract.who)}</span>
   ${p.contract.since?`<span class="d">${days(pd(p.contract.since),TODAY)?dn(days(pd(p.contract.since),TODAY)):'с сегодня'}</span>`:''}
   <span class="eyebrow" style="margin-top:6px">Правила проекта</span><span class="w" style="font-size:12.5px">${p.rules.map(esc).join('<br>')}</span></div></div>`;
}
function pOverview(p){
 const ev=events(p.id).slice(0,10);
 const w=openQ().filter(q=>q.p===p.id).sort((a,b)=>b.days-a.days);
 const idCh=DOCS.filter(d=>d.p===p.id&&d.sec==='Исходные данные заказчика'&&d.ver.length>1&&d.st!=='old').sort((a,b)=>cur(a).k<cur(b).k?1:-1).slice(0,4);
 return `<div class="grid2"><div class="stack">
  <section class="card"><div class="card-h"><h2>С чего начать</h2><span class="fresh">${journalFresh(p.id)||latestLabel()}</span></div>
   <ul class="start">${START[p.id].map(([k,t,c])=>`<li><span class="k ${c}">${k}</span><span>${esc(t)}</span></li>`).join('')}</ul></section>
  <section class="card"><div class="card-h"><h2>У кого мяч</h2><button class="link small" data-act="ptab" data-t="qd">Вопросы и решения</button></div>${w.map(q=>qRow(q,q.kind==='ext'?'wait':'me')).join('')}</section>
 </div><div class="stack">
  <section class="card"><div class="card-h"><h2>Лента</h2><button class="link small" data-act="ptab" data-t="log">Журнал</button></div><ul class="feed">${ev.map(feedLi).join('')}</ul></section>
  ${idCh.length?`<section class="card"><div class="card-h"><h2>Изменилось в исходных данных</h2></div><ul class="feed">${idCh.map(d=>`<li><span class="ic">${I.up}</span><span class="tx"><button class="dn" data-act="doc" data-id="${d.id}">${esc(d.n)}</button> <span class="rev">ред. ${cur(d).r}</span></span><span class="mt">${esc(verChange(d,d.ver.length-1))}</span></li>`).join('')}</ul></section>`:''}
 </div></div>`;
}
function feedLi(e){
 const ic=e.type==='send'?'send':e.type==='dec'||e.type==='inb'?'ok':'';
 return `<li><span class="ic ${ic}">${e.type==='send'?I.out:e.type==='dec'||e.type==='inb'?I.ok:I.up}</span><span class="tx"><b>${EVN[e.type]}</b> · <button class="dn" style="font-weight:400" data-act="doc" data-id="${e.doc.id}">${esc(e.doc.n)}</button> <span class="rev">ред. ${e.v.r}</span></span><span class="mt">${sd(e.d)} ${e.t||''} · ${esc(e.type==='send'?'с нашей почты':e.note||srcLabel(e.v.src))}</span></li>`;
}

/* ---- 4. Позиции ---- */
function pPositions(p){

/* ---- 6. Договор и деньги ---- */
function pMoney(p){
 const pays=PAY.filter(x=>x.p===p.id);
 const dg=DOCS.filter(d=>d.p===p.id&&d.sec==='Договоры'&&d.st!=='old');
 const groups={};dg.forEach(d=>{const g=p.id==='olimp'?(d.zone||'Прочие'):'Договор и приложения';(groups[g]=groups[g]||[]).push(d);});
 const order=p.id==='olimp'?['АГ','ГС-ДЯ','ЗБ','НЯ','Прочие']:Object.keys(groups);
 const notes=DOCS.filter(d=>d.p===p.id&&d.sec==='Записки и разборы'&&/договор|Договор/.test(d.n)&&d.st!=='old');
 const chain=p.id==='raz_dveri'?[['28.09','форма заказчика'],['30.09','наша'],['23.10','их форма'],['26.10','наш окончательный'],['28.10','примечания Тумановой'],['29.10','ответы'],['30.10','отправлено'],['03.11','не подписан']]:p.id==='olimp'?[['22.10','проект АГ'],['02.11','редакция (7)'],['03.11','44 примечания'],['03.11','пакет на 4 зоны']]:[];
 const sum=pays.reduce((s,x)=>s+x.sum,0);
 return `<div class="stack">
 <section class="card"><div class="card-h"><h2>Договор${p.contractNo?' '+esc(p.contractNo):''}</h2><span class="st ${p.contract.st==='Не подписан'?'st-bad':p.contract.st==='На согласовании'?'st-review':'st-draft'}">${esc(p.contract.st)}</span></div>
  <div class="card-b"><div class="small" style="margin-bottom:8px">${esc(p.contract.who)}</div>${chain.length?`<div class="pchain">${chain.map((c,i)=>`<span><b class="tnum">${c[0]}</b> ${esc(c[1])}</span>${i<chain.length-1?'<i>→</i>':''}`).join('')}</div>`:'<span class="nodata small">Ход согласования — нет в данных.</span>'}</div>
  <div class="zones ${p.id==='olimp'?'':'one'}" style="padding:0 16px 4px">${order.filter(g=>groups[g]).map(g=>{const L=groups[g];const main=L.filter(d=>d.rol==='Договор');const ann=L.filter(d=>/^Приложение/.test(d.rol)).sort((a,b)=>(+(a.rol.match(/\d+/)||[99])[0])-(+(b.rol.match(/\d+/)||[99])[0]));const rest=L.filter(d=>!main.includes(d)&&!ann.includes(d));
   const li=(d,lab)=>`<li><span class="n">${lab}</span><button class="dn" data-act="doc" data-id="${d.id}">${esc(d.n)}</button><span>${chip(d.st)} <button class="rev" data-act="doc" data-id="${d.id}">ред. ${cur(d).r}</button></span></li>`;

function regRows(p){
 const R=S.reg;
 let docs=DOCS.filter(d=>d.p===p.id&&d.sec!=='Переписка'&&(R.old||d.st!=='old'));
 if(R.sec!=='all')docs=docs.filter(d=>d.sec===R.sec);
 if(R.zone)docs=docs.filter(d=>d.zone===R.zone);
 if(R.st)docs=docs.filter(d=>d.st===R.st);
 if(R.src)docs=docs.filter(d=>srcKind(cur(d).src)===R.src);
 if(R.q){const q=norm(R.q);docs=docs.filter(d=>norm(d.n+' '+d.code+' '+cur(d).file+' '+cur(d).src).includes(q));}
 let rows=docs.map(d=>({d,v:cur(d),old:d.st==='old'}));
 if(R.old)docs.forEach(d=>d.ver.slice(0,-1).forEach(v=>rows.push({d,v,old:true})));
 const key={name:r=>r.d.n.toLowerCase(),date:r=>r.v.k,code:r=>r.d.code,st:r=>r.old?'z':r.d.st,rev:r=>r.v.r,src:r=>r.v.src,zone:r=>r.d.zone}[R.sort]||(r=>r.v.k);
 rows.sort((a,b)=>{const x=key(a),y=key(b);return (x<y?-1:x>y?1:0)*R.dir||(a.old-b.old);});
 return rows;
}

const STOP=new Set(['крайняя','крайний','крайнее','крайнюю','последняя','последний','последнюю','актуальная','актуальный','актуальную','действующая','действующую','по','в','и','на','для','найди','найти','покажи','где','мне','с','о','от','к','из']);
function norm(s){return String(s||'').toLowerCase().replace(/ё/g,'е').replace(/[«»"(),.:;!?—–_\-\/]/g,' ').replace(/\s+/g,' ').trim();}
DOCS.forEach(d=>{const p=PRJ[d.p];d.hay=norm([d.n,d.code,p.name,secName(d.sec),d.sec,d.zone,d.rol].join(' '));d.hayV=d.ver.map(v=>norm([v.file,v.src,v.tema].join(' ')));});
function tokMatch(words,t){const st=t.length>5?t.slice(0,t.length-2):t.length>3?t.slice(0,t.length-1):t;return words.some(w=>w.startsWith(st));}
function search(q,o){o=o||{};
 const toks=norm(q).split(' ').filter(t=>t&&!STOP.has(t));if(!toks.length)return [];
 const out=[];
 DOCS.forEach(d=>{if(d.sec==='Переписка')return;if(!o.old&&d.st==='old')return;
  const wt=d.hay.split(' ');
  d.ver.forEach((v,i)=>{const isCur=i===d.ver.length-1;if(!isCur&&!o.old)return;
   const words=wt.concat(d.hayV[i].split(' '));if(toks.filter(t=>tokMatch(words,t)).length<toks.length)return;
   const th=toks.filter(t=>tokMatch(norm(d.n).split(' '),t)).length;
   out.push({d,v,isCur:isCur&&d.st!=='old',score:th*10+(isCur&&d.st!=='old'?6:0)+(d.p!=='obshchee'?2:0)+(d.sec!=='Фото'?3:0)+(+v.k.slice(5,10).replace('-',''))/2000});});});
 return out.sort((a,b)=>b.score-a.score);
}
function hl(s,q){let r=esc(s);norm(q).split(' ').filter(t=>t&&!STOP.has(t)&&t.length>2).forEach(t=>{const st=t.length>5?t.slice(0,t.length-2):t;try{r=r.replace(new RegExp('('+st.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'[а-яёa-z0-9]*)','gi'),'<mark>$1</mark>');}catch(e){}});return r;}

 remind:e=>{const q=Q.find(x=>x.id===+e.id);const txt=`${q.from.split(':').pop().trim().split(',')[0]}, добрый день! Напоминаю: ${q.t.charAt(0).toLowerCase()+q.t.slice(1)} — ждём с ${sd(q.since)}. Подскажите, когда ждать ответ?`;
  try{navigator.clipboard.writeText(txt).then(()=>toast('Текст напоминания скопирован — вставьте в Telegram.'),()=>toast(txt));}catch(x){toast(txt);}},
 confirm:e=>{const d=DEC.find(x=>x.id===+e.id);S.done['d'+d.id]=1;const doc=find(d.p,/^ЖУРНАЛ ПРОЕКТА/);if(doc)EXTRA.push({p:d.p,k:'2026-11-03 '+nowT(),d:'03.11.2026',t:nowT(),doc,v:cur(doc),type:'dec',who:TEAM[S.me].n,note:'подтверждено: '+d.t});toast('Решение подтверждено. Создан чек-лист «куда внести».');render();},
 into:e=>{S.done[e.k]=+e.v;render();},
 xpick:e=>{S.done['x'+e.id]=+e.i;const x=XD.find(y=>y.id===+e.id);toast('Действующее значение: '+x.v[+e.i-1][0]+'. Предложено решение — подтвердите в списке решений.');render();},
 inbOk:e=>{const x=INBOX[+e.i];x.state='ok';EXTRA.push({p:x.d.p,k:'2026-11-03 '+nowT(),d:'03.11.2026',t:nowT(),doc:x.d,v:cur(x.d),type:'inb',who:TEAM[S.me].n,note:'разобрано из входящих'});toast('Подтверждено: '+PRJ[x.d.p].name+' → '+secName(x.d.sec));render();},
 inbNo:e=>{INBOX[+e.i].state='no';render();},
 search:e=>{S.q='';go('search');},
 fp:e=>{S.fp=e.v;render();},fs:e=>{S.fs=e.v;render();},
 q:e=>{S.q=e.q;S.voiceMsg='';S.fp='';S.fs='';render();},
 mic:()=>startMic(),
 pal:()=>openPal(),
 palClose:(e,ev)=>{if(ev.target.classList.contains('pal-bg'))closePal();},
 palGo:e=>{const it=PAL_ITEMS[+e.i];closePal();it&&it.a();},
 theme:()=>{const n=isDark()?'light':'dark';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('av-theme',n);}catch(x){}render();},
 sendDoc:()=>{const d=DOC(S.did);toast(isInternal(d)?'Это внутренний документ — наружу не отправляется.':'«'+d.n+'», ред. '+cur(d).r+' — отправка попадёт в журнал. В прототипе письмо не уходит.');},
 approve:()=>{const d=DOC(S.did);const order=['draft','review','ok','prod'];const i=order.indexOf(d.st);d.st=order[(i+1)%order.length];EXTRA.push({p:d.p,k:'2026-11-03 '+nowT(),d:'03.11.2026',t:nowT(),doc:d,v:cur(d),type:'st',who:TEAM[S.me].n,note:'статус: '+STN[d.st]});toast('Статус: '+STN[d.st]+'. Запись в журнале.');render();},
 composePay:()=>{newC('pay');go('compose');},
 cTpl:e=>{newC(e.tpl);render();},
 cAns:e=>{S.c.ans[e.k]=e.v;render();},
 cUndo:e=>{const qs=TPL[S.c.tpl].qs(S.c.ans);const i=qs.findIndex(q=>q.k===e.k);qs.slice(i).forEach(q=>delete S.c.ans[q.k]);if(e.k==='proj')S.c.ans={};S.c.draft=false;S.c.accepted=null;render();},
 cGen:()=>{S.c.draft=true;render();},
 cFix:()=>{S.c.fixOpen=!S.c.fixOpen;render();const t=document.getElementById('fixT');t&&t.focus();},
 cFixQ:e=>{const t=document.getElementById('fixT');if(t)t.value=e.t;},
 cFixGo:()=>{const t=document.getElementById('fixT');const v=t&&t.value.trim();if(!v){toast('Напишите, что поправить, или выберите подсказку.');return;}S.c.fixes.push(v);S.c.fixOpen=false;toast('Правка учтена, черновик пересобран.');render();},
 cAccept:()=>cAccept(),
 cReset:()=>{newC(null);render();},
 botQ:e=>{botAsk(e.q);render();},
 botVoice:()=>{botAsk('крайняя смета Раздоры',true);render();},
 botOpen:e=>openDoc(e.id),
 botMore:e=>{const r=search(e.q).slice(1,5);S.bot.msgs.push({in:1,t:nowT(),h:'Ещё:<br>'+r.map(x=>`• ${esc(x.d.n)} — ${esc(PRJ[x.d.p].name)}, ред. ${x.v.r}`).join('<br>')});render();},
 botVers:e=>{const d=DOC(e.id);S.bot.msgs.push({in:1,t:nowT(),h:`Версии «${esc(d.n)}»:<br>`+d.ver.slice().reverse().slice(0,8).map(v=>`• ред. ${v.r} · ${v.d} — ${esc(srcLabel(v.src))}${v===cur(d)?' <b>(действующая)</b>':''}`).join('<br>')+(d.ver.length>8?`<br>…и ещё ${d.ver.length-8}`:'')});render();},
 botPhoto:()=>{S.bot.msgs.push({fwd:'Мансур',t:nowT(),h:`<div class="thumbs"><i class="w0"></i><i class="w2"></i></div><span class="xs">Коробки, 2 этаж — монтаж</span>`});
  S.bot.msgs.push({in:1,t:nowT(),h:'Похоже на <b>Раздоры. Двери</b> → Фото с объектов (по словам «коробки», «2 этаж»). Верно?',kb:[{l:'Да, Раздоры. Двери',a:'botPick',id:'raz_dveri',w:1},{l:'Раздоры. Мебель',a:'botPick',id:'raz_mebel'},{l:'Олимпийский',a:'botPick',id:'olimp'}]});render();},
 botPick:e=>{const m=S.bot.msgs[+e.i];if(m)m.kb=null;const p=PRJ[e.id];S.bot.msgs.push({h:esc(p.name),t:nowT()});
  const tm=nowT();const d={id:DOCS.length,p:p.id,sec:'Фото',zone:'2 этаж',rol:'',n:'Коробки, 2 этаж — монтаж',st:'ok',ver:[{r:1,d:'03.11.2026',t:tm,k:'2026-11-03 '+tm,file:'photo_2026-11-03.jpg',fmt:'jpg',s:2400000,src:'из Telegram: Мансур (через бота)',tema:''}]};
  d.code='ФТ-'+String(DOCS.filter(x=>x.p===p.id&&x.sec==='Фото').length+1).padStart(3,'0');d.hay=norm(d.n+' '+p.name+' фото');d.hayV=[''];DOCS.push(d);
  S.bot.msgs.push({in:1,t:nowT(),h:`Сохранил: <b>${esc(p.name)}</b> → Фото с объектов, 2 этаж. Запись в журнале проекта.`,kb:[{l:'Открыть в приложении',a:'botOpen',id:d.id,w:1}]});render();},
 botReset:()=>{botInit();render();}
};
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-act]');if(!el)return;const f=ACT[el.dataset.act];if(!f)return;if(el.dataset.act==='palClose'&&ev.target!==el)return;ev.preventDefault();f(el.dataset,ev);});
document.addEventListener('change',ev=>{const el=ev.target;const k=el.dataset&&el.dataset.ch;if(!k)return;const R=S.reg;
 if(k==='me'){S.me=el.value;S.bot=null;render();}
 if(k==='old'){S.old=el.checked;render();}
 if(k==='regOld'){R.old=el.checked;render();}
 if(k==='regZ'){R.zone=el.value;render();} if(k==='regS'){R.st=el.value;render();} if(k==='regSrc'){R.src=el.value;render();}
 if(k==='jrSrc'){S.jr.src=el.value;S.jr.lim=50;render();}
 if(k==='cmpA'){S.cmpA=+el.value;S.cmpB=S.cmpB||DOC(S.did).ver.length;render();}
 if(k==='cmpB'){S.cmpB=+el.value;S.cmpA=S.cmpA||Math.max(1,DOC(S.did).ver.length-1);render();}});
let typeT;
function refocus(id,pos){const q=document.getElementById(id);if(q){q.focus();try{q.setSelectionRange(pos,pos);}catch(e){}}}
document.addEventListener('input',ev=>{const t=ev.target;
 if(t.id==='q'){S.q=t.value;S.voiceMsg='';S.fp='';S.fs='';clearTimeout(typeT);typeT=setTimeout(()=>{const pos=t.selectionStart;render();refocus('q',pos);},200);}
 if(t.id==='regQ'){S.reg.q=t.value;clearTimeout(typeT);typeT=setTimeout(()=>{const pos=t.selectionStart;render();refocus('regQ',pos);},200);}
 if(t.id==='palQ'){S.palQ=t.value;S.palI=0;const pos=t.selectionStart;renderPal();refocus('palQ',pos);}});
document.addEventListener('submit',ev=>{ev.preventDefault();
 if(ev.target.id==='tgForm'){const t=document.getElementById('tgT');const v=t.value.trim();if(!v)return;botAsk(v);render();const n=document.getElementById('tgT');n&&n.focus();}
 if(ev.target.id==='sform')render();});
document.addEventListener('keydown',ev=>{
 if((ev.ctrlKey||ev.metaKey)&&(ev.key==='k'||ev.key==='K'||ev.key==='л'||ev.key==='Л')){ev.preventDefault();S.pal?closePal():openPal();return;}
 if(!S.pal)return;
 if(ev.key==='Escape')closePal();
 else if(ev.key==='ArrowDown'){ev.preventDefault();S.palI=Math.min(PAL_ITEMS.length-1,S.palI+1);renderPal();refocus('palQ',S.palQ.length);}
 else if(ev.key==='ArrowUp'){ev.preventDefault();S.palI=Math.max(0,S.palI-1);renderPal();refocus('palQ',S.palQ.length);}
 else if(ev.key==='Enter'){ev.preventDefault();const it=PAL_ITEMS[S.palI];closePal();it&&it.a();}});
window.addEventListener('hashchange',()=>{const v=S.view,p=S.pid,d=S.did;fromHash();if(S.view!==v||S.pid!==p||S.did!==d)render();});
try{const t=localStorage.getItem('av-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}
fromHash();
render();
})();
</script>
