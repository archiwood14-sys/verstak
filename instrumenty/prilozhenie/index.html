<title>АРХИВУД Проекты</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant:wght@500;600;700&display=swap">
<style>
/* Layout: рабочее место — боковое меню из 4 пунктов слева, справа рабочая область с плотными таблицами; на телефоне меню снизу. Медь — только действие и «у кого мяч». */
:root{
  --bg:#faf0e6; --side:#f3e4d3; --surface:#fffaf4; --sunk:#f4e8da; --hover:#efdfcc;
  --ink:#1a1a1a; --ink2:#46443f; --muted:#76736c; --grey:#95948f; --line:#e6d6c3; --line2:#d8c4ad;
  --copper:#c18048; --copper-ink:#8f5525; --copper-soft:#f5dfc7; --on-copper:#1a1a1a;
  --ok:#2f6a3f; --ok-bg:#e0ecdc; --warn:#8a5220; --warn-bg:#f8e1c5; --bad:#a1321f; --bad-bg:#f7dcd3; --info:#3a5a7a; --info-bg:#dfe7ef;
  --prod-bg:#1a1a1a; --prod-fg:#faf0e6;
  --wood1:#c18048; --wood2:#a7682f; --wood3:#dcae80; --wood4:#8a5426;
  --shadow:0 1px 2px rgba(26,26,26,.05),0 12px 32px rgba(26,26,26,.08);
  --display:'Cormorant','Cormorant Garamond',Georgia,'Times New Roman',serif;
  --body:Arial,'Helvetica Neue',Helvetica,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151413; --side:#1b1917; --surface:#1f1d1b; --sunk:#252220; --hover:#2c2925;
  --ink:#f3e9dd; --ink2:#d2c8bb; --muted:#a29f98; --grey:#95948f; --line:#332f2a; --line2:#45403a;
  --copper:#d0935c; --copper-ink:#e4ad79; --copper-soft:#3a2a1c; --on-copper:#1a1a1a;
  --ok:#8fc49b; --ok-bg:#1e2d21; --warn:#e8b37d; --warn-bg:#3a2a1a; --bad:#ef9583; --bad-bg:#3c1f19; --info:#9dbbd9; --info-bg:#1d2833;
  --prod-bg:#faf0e6; --prod-fg:#1a1a1a;
  --wood1:#a96d3b; --wood2:#8a5426; --wood3:#c18048; --wood4:#6d4320;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 32px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#151413; --side:#1b1917; --surface:#1f1d1b; --sunk:#252220; --hover:#2c2925;
  --ink:#f3e9dd; --ink2:#d2c8bb; --muted:#a29f98; --grey:#95948f; --line:#332f2a; --line2:#45403a;
  --copper:#d0935c; --copper-ink:#e4ad79; --copper-soft:#3a2a1c; --on-copper:#1a1a1a;
  --ok:#8fc49b; --ok-bg:#1e2d21; --warn:#e8b37d; --warn-bg:#3a2a1a; --bad:#ef9583; --bad-bg:#3c1f19; --info:#9dbbd9; --info-bg:#1d2833;
  --prod-bg:#faf0e6; --prod-fg:#1a1a1a;
  --wood1:#a96d3b; --wood2:#8a5426; --wood3:#c18048; --wood4:#6d4320;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 32px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;margin:0;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--copper-ink)}
:focus-visible{outline:2px solid var(--copper);outline-offset:2px;border-radius:4px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.15}
h1{font-family:var(--display);font-weight:600;font-size:clamp(28px,3vw,36px);letter-spacing:.005em}
h2{font-size:15px;font-weight:700}
h3{font-size:13px;font-weight:700}
.num,td,.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:12.5px} .xs{font-size:11.5px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ex{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--line2);border-radius:4px;padding:0 4px;margin-left:4px;vertical-align:1px;white-space:nowrap;font-weight:400}
.sr{position:absolute;left:-9999px}

/* ---------- каркас ---------- */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px 14px;overflow-y:auto}
.brand{display:flex;flex-direction:column;padding:0 10px 18px;background:none;border:0;text-align:left;color:var(--ink)}
.brand b{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.24em}
.brand span{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--copper-ink);margin-top:2px}
.kbtn{display:flex;align-items:center;gap:8px;width:100%;border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:7px 10px;color:var(--muted);font-size:13px;margin-bottom:14px}
.kbtn kbd{margin-left:auto}
.kbtn svg{width:15px;height:15px;flex:none}
kbd{font-family:var(--body);font-size:11px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--muted);background:var(--surface)}
.menu{display:flex;flex-direction:column;gap:1px}
.menu button{display:flex;align-items:center;gap:10px;background:none;border:0;border-radius:7px;padding:7px 10px;color:var(--ink2);font-size:13.5px;text-align:left}
.menu button svg{width:17px;height:17px;flex:none;opacity:.8}
.menu button:hover{background:var(--hover)}
.menu button[aria-current="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 0 0 1px var(--line)}
.menu .cnt{margin-left:auto;font-size:11.5px;color:var(--muted);font-weight:400}
.menu .cnt.hot{color:var(--bad);font-weight:700}
.side-h{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:18px 10px 6px}
.plist button{font-size:13px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line2);flex:none}
.dot.c{background:var(--copper)} .dot.r{background:var(--bad)}
.side-foot{margin-top:auto;padding:12px 4px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.me{display:flex;align-items:center;gap:8px}
.me select{flex:1;min-width:0;border:1px solid var(--line2);border-radius:7px;background:var(--surface);padding:5px 6px;font-size:12.5px}
.ava{width:28px;height:28px;border-radius:50%;background:var(--copper-soft);color:var(--copper-ink);display:inline-grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.iconbtn{width:30px;height:30px;border-radius:7px;border:1px solid var(--line2);background:var(--surface);display:inline-grid;place-items:center;color:var(--ink2);flex:none}
.iconbtn svg{width:16px;height:16px}
.main{min-width:0;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));padding-block:22px 64px}
.inner{max-width:1280px;margin:0 auto}
.mtop,.bnav{display:none}

/* ---------- общие элементы ---------- */
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);margin-bottom:10px}
.crumbs button{background:none;border:0;padding:0;color:var(--ink2)}
.crumbs button:hover{color:var(--copper-ink);text-decoration:underline}
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:18px}
.ph p{margin:6px 0 0;color:var(--ink2);max-width:70ch}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--surface);border-radius:7px;padding:7px 12px;font-size:13px;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--grey)}
.btn.pri{background:var(--copper);border-color:var(--copper);color:var(--on-copper);font-weight:700}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn svg{width:15px;height:15px}
.link{background:none;border:0;padding:0;color:var(--copper-ink);text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1px;font-size:inherit;text-align:left}
.plain{background:none;border:0;padding:0;color:inherit;text-align:left;font-size:inherit}
.plain:hover{color:var(--copper-ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.card-b{padding:14px 16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12.5px;color:var(--ink2);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .c{color:var(--muted);margin-left:5px}
.chip[aria-pressed="true"] .c{color:var(--grey)}
.st{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:700;white-space:nowrap;line-height:1.6}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-draft{background:var(--sunk);color:var(--ink2);box-shadow:inset 0 0 0 1px var(--line2)}
.st-review{background:var(--warn-bg);color:var(--warn)}
.st-ok{background:var(--ok-bg);color:var(--ok)}
.st-prod{background:var(--prod-bg);color:var(--prod-fg)}
.st-old{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line2);text-decoration:line-through}
.st-bad{background:var(--bad-bg);color:var(--bad)}
.st-info{background:var(--info-bg);color:var(--info)}
.rev{font-size:11.5px;color:var(--ink2);border:1px solid var(--line2);border-radius:5px;padding:0 6px;white-space:nowrap;background:var(--surface);font-variant-numeric:tabular-nums}
button.rev:hover{border-color:var(--copper);color:var(--copper-ink)}
.fmt{font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
.src{color:var(--muted);font-size:12.5px}
.flag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:var(--bad);background:var(--bad-bg);border-radius:5px;padding:1px 7px;white-space:nowrap}
.flag.w{color:var(--warn);background:var(--warn-bg)}
.flag.n{color:var(--ink2);background:var(--sunk)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:9px;font-size:13.5px;z-index:80;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px;align-items:start}
.stack{display:flex;flex-direction:column;gap:20px;min-width:0}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 18px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 12px;color:var(--muted);font-size:13.5px;white-space:nowrap;margin-bottom:-1px}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-current="true"]{border-bottom-color:var(--copper);color:var(--ink);font-weight:700}
.tabs .c{font-size:11.5px;color:var(--muted);margin-left:4px;font-weight:400}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:20px;overflow:hidden}
.kpi{padding:12px 14px;border-right:1px solid var(--line);min-width:0;text-align:left;background:none;border-top:0;border-bottom:0;border-left:0;color:var(--ink)}
.kpi:last-child{border-right:0}
.kpi .l{font-size:11.5px;color:var(--muted);display:block}
.kpi .v{font-family:var(--display);font-size:26px;font-weight:600;line-height:1.15;display:block;white-space:nowrap}
.kpi .s{font-size:11.5px;color:var(--muted);display:block}
.kpi.bad .v{color:var(--bad)}
.bar{height:5px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:6px;display:flex}
.bar i{display:block;height:100%;background:var(--ok)}
.bar i.r{background:var(--bad)} .bar i.w{background:var(--copper)}

/* таблицы */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:400;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap;background:var(--surface);position:sticky;top:0;z-index:1}
th button{background:none;border:0;padding:0;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit;display:inline-flex;gap:4px;align-items:center}
th button:hover{color:var(--ink)}
th .ar{font-size:10px;color:var(--copper-ink)}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:hover td{background:var(--sunk)}
tr.click{cursor:pointer}
td.r,th.r{text-align:right;white-space:nowrap}
td.nw{white-space:nowrap}
tfoot td{font-weight:700;border-bottom:0;border-top:1px solid var(--ink)}
.dn{font-weight:700;color:var(--ink);background:none;border:0;padding:0;text-align:left;font-size:13px;line-height:1.35}
.dn:hover{color:var(--copper-ink);text-decoration:underline}
.sub{font-size:12px;color:var(--muted);margin-top:2px}
.sub b{color:var(--copper-ink);font-weight:400}
.code{font-size:11.5px;color:var(--muted);white-space:nowrap}
tr.old td{opacity:.65}
tr.add td{background:var(--ok-bg)}
tr.del td{background:var(--bad-bg);color:var(--bad)}
tr.del td:first-child{text-decoration:line-through}
tr.chg td{background:var(--copper-soft)}
.was{color:var(--muted);text-decoration:line-through;font-size:11.5px;display:block}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.tools select,.tools input[type=search]{border:1px solid var(--line2);border-radius:7px;background:var(--surface);padding:5px 8px;font-size:12.5px;max-width:100%}
.tools input[type=search]{min-width:180px;flex:1 1 180px}
.tools .sp{flex:1}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);cursor:pointer;user-select:none;white-space:nowrap}
.toggle input{appearance:none;width:32px;height:18px;border-radius:999px;background:var(--line2);position:relative;margin:0;cursor:pointer;flex:none}
.toggle input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--surface);transition:left .15s}
.toggle input:checked{background:var(--ink)}
.toggle input:checked::after{left:16px}
.more{display:flex;justify-content:center;padding:12px}

/* сегодня */
.todo{list-style:none;margin:0;padding:0}
.todo li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:4px 10px;padding:10px 16px;border-bottom:1px solid var(--line);align-items:start}
.todo li:last-child{border-bottom:0}
.todo .ck{width:16px;height:16px;border:1.5px solid var(--line2);border-radius:4px;margin-top:2px;background:var(--surface);padding:0}
.todo .ck:hover{border-color:var(--ok)}
.todo .t{font-size:13.5px}
.todo .m{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted);align-items:center}
.todo .ic{width:16px;height:16px;margin-top:2px;color:var(--muted)}
.grp-h{display:flex;align-items:center;gap:8px;padding:9px 16px;background:var(--sunk);border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.grp-h b{color:var(--ink);letter-spacing:0;text-transform:none;font-size:12.5px}
.grp-h.r b{color:var(--bad)}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:2px 10px;padding:9px 16px;border-bottom:1px solid var(--line)}
.feed li:last-child{border-bottom:0}
.feed .ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--ink2)}
.feed .ic svg{width:12px;height:12px}
.feed .ic.send{background:var(--copper-soft);color:var(--copper-ink)}
.feed .ic.ok{background:var(--ok-bg);color:var(--ok)}
.feed .tx{font-size:13px;min-width:0;overflow-wrap:anywhere}
.feed .mt{grid-column:2;font-size:11.5px;color:var(--muted)}

/* канбан */
.board-w{overflow-x:auto;padding-bottom:6px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(178px,1fr);gap:10px;min-width:min-content}
.col{display:flex;flex-direction:column;gap:8px;min-width:0;background:var(--sunk);border-radius:10px;padding:8px}
.col-h{display:flex;justify-content:space-between;gap:6px;align-items:baseline;padding:2px 4px 4px;min-height:36px}
.col-h b{font-size:12px;line-height:1.25}
.col-h span{font-size:11.5px;color:var(--muted)}
.pc{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;color:var(--ink);transition:border-color .12s}
.pc:hover{border-color:var(--copper)}
.pc .t{font-weight:700;font-size:13px;line-height:1.3}
.pc .m{font-size:11.5px;color:var(--muted)}
.pc .ball{font-size:11.5px;color:var(--ink2)}
.pc .ball b{color:var(--copper-ink);font-weight:700}
.pc .bar{margin-top:0}
.col .none{font-size:11.5px;color:var(--muted);text-align:center;padding:10px 0;border:1px dashed var(--line2);border-radius:8px}

/* проект */
.phead{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;margin-bottom:18px}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-top:14px}
.facts div{padding:10px 14px;border-right:1px solid var(--line);min-width:0}
.facts div:nth-child(4n){border-right:0}
.facts div:nth-child(n+5){border-top:1px solid var(--line)}
.facts dt{font-size:11px;color:var(--muted);margin-bottom:2px}
.facts dd{margin:0;font-size:13px;overflow-wrap:anywhere}
.ballbox{background:var(--ink);color:var(--bg);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;align-self:start}
.ballbox .eyebrow{color:var(--grey)}
.ballbox b{font-family:var(--display);font-size:24px;font-weight:600;line-height:1.1}
.ballbox .d{display:inline-flex;align-self:flex-start;background:var(--copper);color:var(--on-copper);border-radius:5px;padding:2px 8px;font-size:11.5px;font-weight:700}
.ballbox .w{font-size:13px;opacity:.9}
.stages{display:flex;gap:3px;margin-top:12px;align-items:center}
.stages i{flex:1;height:4px;border-radius:2px;background:var(--line2)}
.stages i.done{background:var(--ink)} .stages i.now{background:var(--copper)}
.stg-l{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}

/* договоры по зонам */
.zones{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;margin-bottom:18px}
.zone{background:var(--surface);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column}
.zone-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.zone-h b{font-family:var(--display);font-size:22px;font-weight:600}
.zone ul{list-style:none;margin:0;padding:6px 0}
.zone li{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:8px;padding:6px 14px;align-items:baseline;font-size:12.5px}
.zone li .n{color:var(--muted);font-size:11.5px}
.zone li.main .dn{font-size:13px}
.zone-f{margin-top:auto;padding:8px 14px 12px;display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line)}
.notes{background:var(--sunk);border-radius:8px;padding:8px 12px;margin:0 14px 12px;font-size:12.5px}
.notes ul{margin:4px 0 0;padding-left:16px}

/* фото */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:12px}
.tile{background:none;border:1px solid var(--line);border-radius:8px;padding:0;overflow:hidden;text-align:left;color:var(--ink);display:flex;flex-direction:column}
.tile .im{aspect-ratio:4/3;max-width:100%;display:grid;place-items:end start;padding:6px}
.tile .im span{font-size:10.5px;background:var(--surface);color:var(--ink2);border-radius:4px;padding:0 5px}
.tile .cap{padding:6px 8px;font-size:12px;line-height:1.3}
.tile .cap small{display:block;color:var(--muted);font-size:11px}
.w0{background:repeating-linear-gradient(95deg,var(--wood1) 0 7px,var(--wood2) 7px 9px,var(--wood3) 9px 16px)}
.w1{background:linear-gradient(180deg,var(--sunk) 0 58%,var(--wood3) 58% 100%)}
.w2{background:repeating-linear-gradient(0deg,var(--wood4) 0 3px,var(--wood1) 3px 20px)}
.w3{background:linear-gradient(90deg,var(--sunk) 0 30%,var(--wood2) 30% 34%,var(--sunk) 34% 70%,var(--wood2) 70% 74%,var(--sunk) 74%)}
.w4{background:radial-gradient(circle at 30% 40%,var(--wood3),var(--wood2) 60%,var(--wood4))}

/* документ */
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:10px;position:relative;overflow:hidden}
.sheet-b{padding:20px 22px}
.sheet h4{font-family:var(--display);font-size:22px;font-weight:600;margin:0 0 6px}
.wm{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:2}
.wm span{font-family:var(--display);font-size:clamp(48px,8vw,104px);font-weight:700;color:var(--bad);opacity:.13;transform:rotate(-18deg);letter-spacing:.1em}
.oldbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:13px}
.exbar{font-size:12px;color:var(--muted);background:var(--sunk);padding:6px 22px;border-bottom:1px solid var(--line)}
.filecard{display:flex;gap:16px;align-items:center;padding:28px 22px}
.filecard .big{width:68px;height:84px;border-radius:6px;background:var(--sunk);border:1px solid var(--line2);display:grid;place-items:end center;padding-bottom:10px;font-size:12px;font-weight:700;color:var(--copper-ink);flex:none;position:relative}
.filecard .big::before{content:"";position:absolute;top:-1px;right:-1px;width:18px;height:18px;background:linear-gradient(225deg,var(--bg) 50%,var(--line2) 50%)}
.clause{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.clause.chg{background:var(--copper-soft);border-radius:6px;padding:7px}
.clause .note{display:block;margin-top:4px;font-size:12px;color:var(--copper-ink)}
del{color:var(--bad);background:var(--bad-bg);text-decoration:line-through;padding:0 2px}
ins{color:var(--ok);background:var(--ok-bg);text-decoration:none;padding:0 2px}
.drawing{color:var(--ink);width:100%;max-width:100%;height:auto;background:var(--bg);border-radius:8px;border:1px solid var(--line)}
.hist{list-style:none;margin:0;padding:0}
.hist li{border-bottom:1px solid var(--line)}
.hist li:last-child{border-bottom:0}
.hv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 10px;padding:9px 14px;text-align:left;background:none;border:0;color:var(--ink);width:100%}
.hv:hover{background:var(--sunk)}
.hv[aria-current="true"]{background:var(--sunk);box-shadow:inset 3px 0 0 var(--copper)}
.hv .c2{grid-column:2;font-size:12px;color:var(--ink2);overflow-wrap:anywhere}
.hv .c3{grid-column:2;font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}
.dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 14px;margin:0;font-size:13px}
.dl dt{color:var(--muted)}
.dl dd{margin:0;overflow-wrap:anywhere}
.cmp{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
select{background:var(--surface);border:1px solid var(--line2);border-radius:7px;padding:5px 8px;font-size:13px;max-width:100%}
.delta{display:flex;flex-wrap:wrap;gap:12px 28px;margin-top:14px;padding:12px 14px;background:var(--sunk);border-radius:8px}
.delta div{display:flex;flex-direction:column}
.delta b{font-family:var(--display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.pos{color:var(--ok)} .neg{color:var(--bad)}

/* гант */
.gw{overflow-x:auto}
.gantt{min-width:860px;position:relative}
.g-row{display:grid;grid-template-columns:220px minmax(0,1fr);border-bottom:1px solid var(--line);min-height:34px}
.g-row.h{position:sticky;top:0;background:var(--surface);z-index:2;border-bottom:1px solid var(--line2)}
.g-name{padding:7px 12px;font-size:12.5px;border-right:1px solid var(--line);min-width:0}
.g-name b{font-size:13px}
.g-name .xs{display:block;color:var(--muted)}
.g-tl{position:relative}
.g-m{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);font-size:11px;color:var(--muted);padding:8px 0 0 6px;white-space:nowrap}
.g-bar{position:absolute;height:14px;top:50%;margin-top:-7px;border-radius:4px;background:var(--wood3);font-size:10.5px;line-height:14px;padding:0 6px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:0}
.g-bar.done{background:var(--line2);color:var(--ink2)}
.g-bar.now{background:var(--copper);color:var(--on-copper)}
.g-bar.plan{background:transparent;box-shadow:inset 0 0 0 1.5px var(--copper);color:var(--copper-ink)}
.g-ms{position:absolute;top:50%;width:11px;height:11px;margin:-6px 0 0 -6px;transform:rotate(45deg);background:var(--ink);border:2px solid var(--surface);padding:0}
.g-ms.bad{background:var(--bad)} .g-ms.pay{background:var(--ok)} .g-ms.plan{background:var(--surface);box-shadow:0 0 0 1.5px var(--ink)}
.g-today{position:absolute;top:0;bottom:0;width:0;border-left:1.5px solid var(--bad);z-index:3;pointer-events:none}
.g-today span{position:absolute;top:2px;left:4px;font-size:10.5px;color:var(--bad);font-weight:700;white-space:nowrap}
.g-sub .g-name{padding-left:26px;color:var(--ink2)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);padding:10px 14px;border-top:1px solid var(--line)}
.legend i{display:inline-block;width:14px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}
.legend i.d{width:9px;height:9px;transform:rotate(45deg);border-radius:0}

/* платёжный календарь */
.cal{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;padding:14px 16px;align-items:end}
.cal .wk{display:flex;flex-direction:column;gap:4px;align-items:stretch;min-width:0}
.cal .st2{display:flex;flex-direction:column-reverse;height:110px;border-radius:5px;background:var(--sunk);overflow:hidden}
.cal .st2 i{display:block;background:var(--copper)}
.cal .st2 i.r{background:var(--bad)} .cal .st2 i.g{background:var(--ok)}
.cal .lb{font-size:11px;color:var(--muted);text-align:center;white-space:nowrap}
.cal .vv{font-size:11.5px;text-align:center;font-weight:700;white-space:nowrap}

/* поиск и палитра */
.sbar{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line2);border-radius:10px;padding:5px 5px 5px 14px}
.sbar svg.lens{width:18px;height:18px;color:var(--muted);flex:none}
.sbar input{flex:1;min-width:0;border:0;background:transparent;font-size:17px;padding:8px 0;outline:none}
.mic{width:40px;height:40px;border-radius:8px;border:0;background:var(--copper);color:var(--on-copper);display:grid;place-items:center;flex:none}
.mic svg{width:19px;height:19px}
.mic.on{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--copper-soft)}100%{box-shadow:0 0 0 12px transparent}}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none}.pc{transition:none}}
.hint{font-size:13px;color:var(--ink2);background:var(--sunk);border-radius:8px;padding:9px 12px}
.sgrid{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px;align-items:start;margin-top:16px}
.facet h3{margin:0 0 6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:400}
.facet button{display:flex;justify-content:space-between;width:100%;background:none;border:0;border-radius:6px;padding:5px 8px;font-size:13px;color:var(--ink2);text-align:left}
.facet button:hover{background:var(--sunk)}
.facet button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.facet .c{color:var(--muted);font-size:12px}
.facet>div{margin-bottom:16px}
.res{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 14px;padding:11px 14px;border-bottom:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-top:0;color:var(--ink);width:100%}
.res:hover{background:var(--sunk)}
.res .t{font-weight:700;font-size:14px;overflow-wrap:anywhere}
.res .meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted);align-items:center}
mark{background:var(--copper-soft);color:var(--ink);padding:0 1px;border-radius:2px}
.pal-bg{position:fixed;inset:0;background:rgba(26,26,26,.35);z-index:70;display:flex;justify-content:center;align-items:flex-start;padding:max(10vh,16px) 16px 16px}
.pal{width:100%;max-width:640px;background:var(--surface);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.pal .sbar{border:0;border-bottom:1px solid var(--line);border-radius:0}
.pal-l{max-height:min(60vh,460px);overflow-y:auto;padding:6px}
.pal-i{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;background:none;border:0;border-radius:7px;padding:8px 10px;text-align:left;color:var(--ink);font-size:13.5px}
.pal-i svg{width:16px;height:16px;color:var(--muted)}
.pal-i[aria-selected="true"]{background:var(--sunk)}
.pal-i .m{font-size:11.5px;color:var(--muted)}
.pal-g{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:8px 10px 4px}
.pal-f{display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}

/* составить */
.compose{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
.chat{display:flex;flex-direction:column;gap:12px}
.msg{max-width:680px;padding:12px 14px;border-radius:10px;font-size:13.5px}
.msg.ai{background:var(--surface);border:1px solid var(--line);border-top-left-radius:3px}
.msg.me{background:var(--ink);color:var(--bg);align-self:flex-end;border-top-right-radius:3px}
.msg .who{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--copper-ink);margin-bottom:5px}
.msg .chips{margin-top:10px}
.opt{border:1px solid var(--copper);background:transparent;color:var(--ink);border-radius:8px;padding:7px 12px;font-size:13px;text-align:left}
.opt:hover,.opt[aria-pressed="true"]{background:var(--copper-soft)}
.conflict{border-left:3px solid var(--copper);padding-left:10px;color:var(--ink2)}
.srcs{list-style:none;margin:0;padding:0}
.srcs li button{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 14px;color:var(--ink);font-size:12.5px;width:100%}
.srcs li button:hover{background:var(--sunk)}
.srcs .n{width:20px;height:20px;border-radius:50%;background:var(--copper-soft);color:var(--copper-ink);font-size:10.5px;font-weight:700;display:grid;place-items:center}
.srcs .m{grid-column:2;font-size:11.5px;color:var(--muted)}
.draft{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;max-width:760px}
.draft .warnline{background:var(--warn-bg);color:var(--warn);padding:9px 18px;font-size:12.5px;font-weight:700}
.draft .paper{padding:24px 28px}
.draft .paper h4{font-family:var(--display);font-size:24px;text-align:center;margin:0 0 4px;font-weight:600}
.draft .paper .subh{text-align:center;color:var(--muted);font-size:12.5px;margin-bottom:18px}
.draft .paper p{margin:0 0 9px;font-size:13.5px}
.draft sup{font-size:10px;color:var(--copper-ink);font-weight:700;margin-left:1px}
.draft .act{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);background:var(--sunk)}
.fix{display:flex;flex-direction:column;gap:8px;padding:14px 18px;border-top:1px solid var(--line)}
textarea{width:100%;min-height:64px;border:1px solid var(--line2);border-radius:8px;background:var(--bg);padding:9px;resize:vertical;font-size:13px}
.steps{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap}
.steps span{font-size:12px;color:var(--muted);border-bottom:2px solid var(--line2);padding:0 6px 4px}
.steps span.on{color:var(--ink);border-bottom-color:var(--copper)}

/* бот */
.botgrid{display:grid;grid-template-columns:390px minmax(0,1fr);gap:40px;align-items:start}
.phone{width:100%;max-width:380px;border:10px solid var(--ink);border-radius:40px;background:var(--sunk);overflow:hidden;display:flex;flex-direction:column;height:720px;box-shadow:var(--shadow)}
.tg-top{display:flex;gap:10px;align-items:center;padding:12px 14px 10px;background:var(--surface);border-bottom:1px solid var(--line)}
.tg-top .ava{background:var(--ink);color:var(--copper);font-family:var(--display);font-size:16px}
.tg-top b{font-size:14px;display:block}
.tg-top small{font-size:12px;color:var(--muted)}
.tg-body{flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:8px}
.b{max-width:86%;padding:8px 11px;border-radius:14px;font-size:13.5px;line-height:1.4}
.b.in{background:var(--surface);align-self:flex-start;border-bottom-left-radius:4px}
.b.out{background:var(--copper-soft);align-self:flex-end;border-bottom-right-radius:4px}
.b small{display:block;font-size:10.5px;color:var(--muted);margin-top:3px;text-align:right}
.b .fwd{font-size:12px;color:var(--copper-ink);margin-bottom:4px}
.file{display:flex;gap:10px;align-items:center;margin:4px 0}
.file i{width:38px;height:38px;border-radius:9px;background:var(--copper);color:var(--on-copper);display:grid;place-items:center;font-style:normal;font-size:10.5px;font-weight:700;flex:none}
.file b{font-size:13px;display:block;line-height:1.25}
.file span{font-size:11.5px;color:var(--muted)}
.kb{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:6px}
.kb button{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px;font-size:12px;color:var(--copper-ink)}
.kb button.wide{grid-column:1/-1}
.tg-quick{display:flex;gap:6px;overflow-x:auto;padding:8px 10px 4px;scrollbar-width:none}
.tg-quick button{flex:none;border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:5px 10px;font-size:12px;color:var(--ink2)}
.tg-in{display:flex;gap:6px;align-items:center;padding:8px 10px 12px;background:var(--surface);border-top:1px solid var(--line)}
.tg-in input{flex:1;min-width:0;border:1px solid var(--line);border-radius:999px;padding:8px 12px;background:var(--bg);font-size:14px}
.tg-in button{width:34px;height:34px;border-radius:50%;border:0;background:var(--copper);color:var(--on-copper);display:grid;place-items:center;flex:none}
.tg-in button svg{width:15px;height:15px}
.voice{display:flex;align-items:center;gap:8px}
.voice i{display:block;height:16px;flex:1;min-width:90px;background:repeating-linear-gradient(90deg,var(--copper-ink) 0 2px,transparent 2px 5px);opacity:.6;border-radius:2px}
.thumbs{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.thumbs i{aspect-ratio:4/3;border-radius:6px;display:block}
.explain ol{padding-left:18px;margin:10px 0 0;display:flex;flex-direction:column;gap:10px;max-width:62ch}
.explain li{color:var(--ink2)}
.explain li b{color:var(--ink)}


/* ---------- v3: портфель, решения, расхождения, входящие, позиции ---------- */
.fresh{font-size:11.5px;color:var(--muted);white-space:nowrap}
.fresh::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:1px}
.fresh.old::before{background:var(--copper)}
.nodata{color:var(--muted);font-style:italic}
.pf{display:flex;flex-direction:column}
.pf-row{display:grid;grid-template-columns:minmax(170px,1.1fr) minmax(150px,1fr) minmax(170px,1fr) minmax(160px,1fr) minmax(200px,1.5fr);gap:14px;padding:14px 16px;border-bottom:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-top:0;color:var(--ink);width:100%;align-items:start}
.pf-row:last-child{border-bottom:0}
.pf-row:hover{background:var(--sunk)}
.pf-row.red{box-shadow:inset 3px 0 0 var(--bad)}
.pf-h{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface)}
.pf-h:hover{background:var(--surface)}
.pf-row .pn{font-weight:700;font-size:14.5px}
.pf-row .l2{font-size:12px;color:var(--muted);margin-top:2px}
.pf-row .v{font-size:13px}
.pf-row .lab{display:none;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.start{list-style:none;margin:0;padding:0;counter-reset:s}
.start li{display:grid;grid-template-columns:84px minmax(0,1fr);gap:10px;padding:8px 16px;border-bottom:1px solid var(--line);font-size:13.5px}
.start li:last-child{border-bottom:0}
.start .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.start .k.r{color:var(--bad);font-weight:700}
.start .k.c{color:var(--copper-ink);font-weight:700}
.wt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 16px;border-bottom:1px solid var(--line);align-items:start}
.wt:last-child{border-bottom:0}
.wt .t{font-size:13.5px}
.wt .m{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted);align-items:center}
.wt .who{font-weight:700;color:var(--copper-ink)}
.days{font-family:var(--display);font-size:22px;font-weight:600;line-height:1;text-align:right;white-space:nowrap}
.days small{display:block;font-family:var(--body);font-size:10.5px;color:var(--muted);font-weight:400}
.days.r{color:var(--bad)}
.dec{padding:12px 16px;border-bottom:1px solid var(--line)}
.dec:last-child{border-bottom:0}
.dec-h{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;justify-content:space-between}
.dec-h b{font-size:14px}
.dec .m{font-size:12px;color:var(--muted);margin-top:3px}
.into{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:3px}
.into li{display:flex;gap:8px;align-items:center;font-size:12.5px}
.into button{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--line2);background:var(--surface);padding:0;display:grid;place-items:center;flex:none;color:var(--ok)}
.into button svg{width:11px;height:11px}
.into li.y{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line2)}
.into li.y button{border-color:var(--ok);background:var(--ok-bg)}
.st-prop{background:transparent;color:var(--copper-ink);box-shadow:inset 0 0 0 1px var(--copper)}
.st-conf{background:var(--ok-bg);color:var(--ok)}
.xd{padding:12px 16px;border-bottom:1px solid var(--line)}
.xd:last-child{border-bottom:0}
.xd-h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 10px;align-items:baseline}
.xd-h b{font-size:14px}
.ab{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-top:8px}
.ab button,.ab div{background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;text-align:left;color:var(--ink)}
.ab button:hover{border-color:var(--copper)}

/* ---- 6. Договор и деньги ---- */

 const groups={};dg.forEach(d=>{const g=p.id==='olimp'?(d.zone||'Прочие'):'Договор и приложения';(groups[g]=groups[g]||[]).push(d);});

 const sum=pays.reduce((s,x)=>s+x.sum,0);
 return `<div class="stack">
 <section class="card"><div class="card-h"><h2>Договор${p.contractNo?' '+esc(p.contractNo):''}</h2><span class="st ${p.contract.st==='Не подписан'?'st-bad':p.contract.st==='На согласовании'?'st-review':'st-draft'}">${esc(p.contract.st)}</span></div>
  <div class="card-b"><div class="small" style="margin-bottom:8px">${esc(p.contract.who)}</div>${chain.length?`<div class="pchain">${chain.map((c,i)=>`<span><b class="tnum">${c[0]}</b> ${esc(c[1])}</span>${i<chain.length-1?'<i>→</i>':''}`).join('')}</div>`:'<span class="nodata small">Ход согласования — нет в данных.</span>'}</div>
  <div class="zones ${p.id==='olimp'?'':'one'}" style="padding:0 16px 4px">${order.filter(g=>groups[g]).map(g=>{const L=groups[g];const main=L.filter(d=>d.rol==='Договор');const ann=L.filter(d=>/^Приложение/.test(d.rol)).sort((a,b)=>(+(a.rol.match(/\d+/)||[99])[0])-(+(b.rol.match(/\d+/)||[99])[0]));const rest=L.filter(d=>!main.includes(d)&&!ann.includes(d));
   const li=(d,lab)=>`<li><span class="n">${lab}</span><button class="dn" data-act="doc" data-id="${d.id}">${esc(d.n)}</button><span>${chip(d.st)} <button class="rev" data-act="doc" data-id="${d.id}">ред. ${cur(d).r}</button></span></li>`;
   return `<section class="zone"><div class="zone-h"><b>${p.id==='olimp'&&g!=='Прочие'?'Зона '+esc(g):esc(g)}</b>${p.id==='olimp'&&g==='АГ'?'<span class="small tnum">5 988 911,67 ₽</span>':''}</div><ul>${main.map(d=>li(d,'Договор')).join('')}${ann.map(d=>li(d,'Прил. '+((d.rol.match(/Приложение (\d+)/)||[])[1]||'—'))).join('')}${rest.map(d=>li(d,'Связан.')).join('')}</ul></section>`;}).join('')||'<p class="empty">Договоров в каталоге нет.</p>'}</div>
  ${notes.length?`<div class="card-b" style="border-top:1px solid var(--line)"><h3 style="margin-bottom:6px">Записки к договору</h3><ul class="feed" style="margin:0 -16px">${notes.map(d=>`<li><span class="ic">${I.doc}</span><span class="tx"><button class="dn" style="font-weight:400" data-act="doc" data-id="${d.id}">${esc(d.n)}</button></span><span class="mt">ред. ${cur(d).r} · ${cur(d).d}${isInternal(d)?' · внутреннее':''}</span></li>`).join('')}</ul></div>`:''}</section>
 <section class="card"><div class="card-h"><h2>Платежи</h2>${p.id==='raz_dveri'?`<button class="btn sm pri" data-act="composePay">${I.pen} Собрать уведомление о сроках оплаты</button>`:''}</div>
  ${pays.length?`<div class="tw"><table class="reg"><thead><tr><th>№</th><th>Платёж</th><th class="r">Сумма</th><th>Срок по договору</th><th>Согласованный срок</th><th>Факт</th><th>Статус</th></tr></thead><tbody>
  ${pays.map(x=>`<tr class="${x.agreed?'hilite':''}"><td class="inl code">${x.n}</td><td><b>${esc(x.t)}</b>${x.cond?`<div class="sub">${esc(x.cond)}</div>`:''}</td><td class="r inl">${money(x.sum)}</td><td class="nw inl">${x.due?x.due:'<span class="nodata">по условию</span>'}</td><td class="nw inl">${x.agreed?`<b>${x.agreed}</b><div class="sub">${esc(x.agreedSrc)}</div>`:'—'}</td><td class="nw inl">${x.fact||'—'}</td><td class="inl">${payChip(x)}</td></tr>`).join('')}</tbody>
  <tfoot><tr><td></td><td>Итого</td><td class="r">${money(sum)}</td><td colspan="4"></td></tr></tfoot></table></div>
  <div class="sumcheck">${Math.abs(sum-p.sum)<0.01?`Сумма платежей = цена договора (${money(p.sum)}) — сверено программой.`:`Сумма платежей ${money(sum)} не равна цене ${money(p.sum)} — проверить.`}</div>`:
  '<p class="empty">Платежей в данных нет. Добавьте график из договора — пересланным файлом в бот.</p>'}</section>
 ${p.id==='raz_dveri'?`<section class="card"><div class="card-h"><h2>Что решить по договору</h2></div>${XD.filter(x=>x.p===p.id&&(x.id===2||x.id===4)).map(xdRow).join('')}</section>`:''}
 </div>`;
}

/* ============ 5. РЕЕСТР ДОКУМЕНТОВ ============ */
function regRows(p){
 const R=S.reg;
 let docs=DOCS.filter(d=>d.p===p.id&&d.sec!=='Переписка'&&(R.old||d.st!=='old'));
 if(R.sec!=='all')docs=docs.filter(d=>d.sec===R.sec);
 if(R.zone)docs=docs.filter(d=>d.zone===R.zone);
 if(R.st)docs=docs.filter(d=>d.st===R.st);
 if(R.src)docs=docs.filter(d=>srcKind(cur(d).src)===R.src);
 if(R.q){const q=norm(R.q);docs=docs.filter(d=>norm(d.n+' '+d.code+' '+cur(d).file+' '+cur(d).src).includes(q));}
 let rows=docs.map(d=>({d,v:cur(d),old:d.st==='old'}));
 if(R.old)docs.forEach(d=>d.ver.slice(0,-1).forEach(v=>rows.push({d,v,old:true})));
 const key={name:r=>r.d.n.toLowerCase(),date:r=>r.v.k,code:r=>r.d.code,st:r=>r.old?'z':r.d.st,rev:r=>r.v.r,src:r=>r.v.src,zone:r=>r.d.zone}[R.sort]||(r=>r.v.k);
 rows.sort((a,b)=>{const x=key(a),y=key(b);return (x<y?-1:x>y?1:0)*R.dir||(a.old-b.old);});
 return rows;
}
function registry(p){
 const R=S.reg;
 const all=DOCS.filter(d=>d.p===p.id&&d.sec!=='Переписка'&&d.st!=='old');
 const hidden=DOCS.filter(d=>d.p===p.id&&d.sec!=='Переписка'&&d.st==='old').length+DOCS.filter(d=>d.p===p.id&&d.sec!=='Переписка').reduce((s,d)=>s+d.ver.length-1,0);
 const secs=SECSHOW.filter(s=>all.some(d=>d.sec===s));
 if(R.sec!=='all'&&!secs.includes(R.sec))R.sec='all';
 const rows=regRows(p);const shown=rows.slice(0,R.lim);
 const th=(k,n,cls)=>`<th class="${cls||''}"><button data-act="sort" data-k="${k}">${n}${R.sort===k?`<span class="ar">${R.dir>0?'▲':'▼'}</span>`:''}</button></th>`;
 const zones=[...new Set(all.map(d=>d.zone).filter(Boolean))].sort();
 const photo=R.sec==='Фото'&&!R.old;
 return `<div class="chips" style="margin-bottom:12px" role="group" aria-label="Разделы">
  <button class="chip" data-act="regsec" data-sec="all" aria-pressed="${R.sec==='all'}">Все<span class="c">${all.length}</span></button>
  ${secs.map(s=>`<button class="chip" data-act="regsec" data-sec="${esc(s)}" aria-pressed="${R.sec===s}">${esc(secName(s))}<span class="c">${all.filter(d=>d.sec===s).length}</span></button>`).join('')}</div>
 <section class="card"><div class="tools">
  <label for="regQ" class="sr">Фильтр</label><input type="search" id="regQ" placeholder="Название, код, файл" value="${esc(R.q)}">

 if(v.rows)return `${d.note?`<p class="small muted" style="margin:0 0 10px">${esc(d.note)}</p>`:''}<div class="tw"><table><thead><tr><th>Статья</th><th class="r">Сумма</th></tr></thead><tbody>${v.rows.map(r=>`<tr><td>${esc(r.n)}</td><td class="r">${money(r.q*r.p)}</td></tr>`).join('')}</tbody><tfoot><tr><td>Итого</td><td class="r">${money(total(v.rows))}</td></tr></tfoot></table></div>`;

/* ============ ПОИСК ============ */
const STOP=new Set(['крайняя','крайний','крайнее','крайнюю','последняя','последний','последнюю','актуальная','актуальный','актуальную','действующая','действующую','по','в','и','на','для','найди','найти','покажи','где','мне','с','о','от','к','из']);
function norm(s){return String(s||'').toLowerCase().replace(/ё/g,'е').replace(/[«»"(),.:;!?—–_\-\/]/g,' ').replace(/\s+/g,' ').trim();}
DOCS.forEach(d=>{const p=PRJ[d.p];d.hay=norm([d.n,d.code,p.name,secName(d.sec),d.sec,d.zone,d.rol].join(' '));d.hayV=d.ver.map(v=>norm([v.file,v.src,v.tema].join(' ')));});
function tokMatch(words,t){const st=t.length>5?t.slice(0,t.length-2):t.length>3?t.slice(0,t.length-1):t;return words.some(w=>w.startsWith(st));}
function search(q,o){o=o||{};
 const toks=norm(q).split(' ').filter(t=>t&&!STOP.has(t));if(!toks.length)return [];
 const out=[];
 DOCS.forEach(d=>{if(d.sec==='Переписка')return;if(!o.old&&d.st==='old')return;
  const wt=d.hay.split(' ');
  d.ver.forEach((v,i)=>{const isCur=i===d.ver.length-1;if(!isCur&&!o.old)return;
   const words=wt.concat(d.hayV[i].split(' '));if(toks.filter(t=>tokMatch(words,t)).length<toks.length)return;
   const th=toks.filter(t=>tokMatch(norm(d.n).split(' '),t)).length;
   out.push({d,v,isCur:isCur&&d.st!=='old',score:th*10+(isCur&&d.st!=='old'?6:0)+(d.p!=='obshchee'?2:0)+(d.sec!=='Фото'?3:0)+(+v.k.slice(5,10).replace('-',''))/2000});});});
 return out.sort((a,b)=>b.score-a.score);
}
function hl(s,q){let r=esc(s);norm(q).split(' ').filter(t=>t&&!STOP.has(t)&&t.length>2).forEach(t=>{const st=t.length>5?t.slice(0,t.length-2):t;try{r=r.replace(new RegExp('('+st.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'[а-яёa-z0-9]*)','gi'),'<mark>$1</mark>');}catch(e){}});return r;}
function vSearch(){
 const base=S.q.trim()?search(S.q,{old:S.old}):[];
 const res=base.filter(r=>(!S.fp||r.d.p===S.fp)&&(!S.fs||r.d.sec===S.fs));
 const cntBy=f=>{const m={};base.forEach(r=>{const k=f(r);m[k]=(m[k]||0)+1;});return Object.entries(m).sort((a,b)=>b[1]-a[1]);};
 return `<div class="ph"><div><div class="eyebrow">Все проекты · ${DOCS.filter(d=>d.st!=='old'&&d.sec!=='Переписка').length} действующих документов · ${RAW.nfiles} файлов</div><h1>Поиск</h1><p>Пишите как говорите: «крайняя смета Раздоры», «договор АГ», «пилот ИР-22». По умолчанию — только действующие версии.</p></div></div>
 <form class="sbar" id="sform" role="search">${I.search.replace('<svg','<svg class="lens"')}<label for="q" class="sr">Запрос</label><input id="q" type="search" autocomplete="off" placeholder="Что найти?" value="${esc(S.q)}"><button type="button" class="mic ${S.listening?'on':''}" data-act="mic" aria-label="Сказать голосом">${I.mic}</button></form>
 <div class="chips" style="margin:10px 0">${['крайняя смета Раздоры','договор АГ','фиксация','пилот ИР 22','схема маркировки','уведомление об оплате'].map(x=>`<button class="chip" data-act="q" data-q="${x}">${x}</button>`).join('')}<span style="flex:1"></span><label class="toggle"><input type="checkbox" data-ch="old" ${S.old?'checked':''}> Включая заменённые</label></div>
 ${S.voiceMsg?`<p class="hint">${esc(S.voiceMsg)}</p>`:''}
 ${S.q.trim()?`<div class="sgrid"><aside class="facet">
  <div><h3>Проект</h3><button data-act="fp" data-v="" aria-pressed="${!S.fp}"><span>Все</span><span class="c">${base.length}</span></button>${cntBy(r=>r.d.p).map(([k,n])=>`<button data-act="fp" data-v="${k}" aria-pressed="${S.fp===k}"><span>${esc(PRJ[k].name)}</span><span class="c">${n}</span></button>`).join('')}</div>
  <div><h3>Раздел</h3><button data-act="fs" data-v="" aria-pressed="${!S.fs}"><span>Все</span></button>${cntBy(r=>r.d.sec).map(([k,n])=>`<button data-act="fs" data-v="${esc(k)}" aria-pressed="${S.fs===k}"><span>${esc(secName(k))}</span><span class="c">${n}</span></button>`).join('')}</div></aside>
 <section class="card">${res.slice(0,60).map(r=>{const p=PRJ[r.d.p];
  return `<button class="res" data-act="doc" data-id="${r.d.id}" ${r.v!==cur(r.d)?`data-r="${r.v.r}"`:''}><span class="t">${hl(r.d.n,S.q)}</span><span>${r.isCur?chip(r.d.st):chip('old')}</span>
   <span class="meta"><b style="color:var(--ink2)">${esc(p.name)}</b><span>${esc(secName(r.d.sec))}${r.d.zone?' · '+esc(r.d.zone):''}</span><span class="rev">ред. ${r.v.r}${r.v!==cur(r.d)?' → действующая '+cur(r.d).r:''}</span><span class="tnum">${r.v.d}</span><span>${esc(srcLabel(r.v.src))}</span><span class="fmt">${esc(r.v.fmt)}</span></span></button>`;}).join('')||'<p class="empty">Ничего не нашлось. Попробуйте короче: проект и тип документа — «смета Олимпийский».</p>'}</section></div>`:''}`;
}
let rec=null;
function startMic(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 const fb=m=>{S.listening=false;S.voiceMsg=m||'Голосовой ввод в этом окне недоступен. Напишите запрос — поиск работает так же. В Telegram-боте можно отправить голосовое.';render();const q=document.getElementById('q');q&&q.focus();};
 if(!SR)return fb();
 if(S.listening&&rec){try{rec.stop();}catch(e){}return;}
 try{rec=new SR();rec.lang='ru-RU';rec.interimResults=true;
  rec.onresult=e=>{const t=Array.from(e.results).map(r=>r[0].transcript).join(' ');S.q=t;const q=document.getElementById('q');if(q)q.value=t;if(e.results[e.results.length-1].isFinal){S.listening=false;S.voiceMsg='Распознано: «'+t+'»';render();}};
  rec.onerror=()=>fb();rec.onend=()=>{if(S.listening){S.listening=false;render();}};
  rec.start();S.listening=true;S.voiceMsg='Слушаю… Скажите, например: «крайняя смета Раздоры».';render();
 }catch(e){fb();}
}

let PAL_ITEMS=[];
function palItems(){
 const q=S.palQ.trim();const it=[];
 if(!q){NAV.forEach(n=>it.push({g:'Перейти',i:n.i,t:n.n,a:()=>go(n.v)}));[...PROJECTS,PRJ.drugie,PRJ.obshchee].forEach(p=>it.push({g:'Проекты',i:'proj',t:p.name,a:()=>openProj(p.id)}));return it;}
 [...PROJECTS,PRJ.drugie,PRJ.obshchee].filter(p=>norm(p.name).includes(norm(q))).forEach(p=>it.push({g:'Проекты',i:'proj',t:p.name,a:()=>openProj(p.id)}));
 search(q).slice(0,9).forEach(r=>it.push({g:'Документы — действующие версии',i:'doc',t:r.d.n,m:PRJ[r.d.p].name+' · ред. '+r.v.r+' · '+r.v.d,a:()=>openDoc(r.d.id)}));
 it.push({g:'Ещё',i:'search',t:'Все результаты: «'+q+'»',a:()=>{S.q=q;go('search');}});
 return it;
}
function renderPal(){
 const el=document.getElementById('pal');if(!S.pal){el.innerHTML='';return;}
 const it=palItems();if(S.palI>=it.length)S.palI=0;let g='';
 el.innerHTML=`<div class="pal-bg" data-act="palClose"><div class="pal" role="dialog" aria-label="Быстрый поиск">
  <div class="sbar">${I.search.replace('<svg','<svg class="lens"')}<label for="palQ" class="sr">Найти</label><input id="palQ" autocomplete="off" placeholder="Документ, проект или раздел" value="${esc(S.palQ)}"><kbd>Esc</kbd></div>
  <div class="pal-l" role="listbox">${it.map((x,i)=>{const h=x.g!==g?`<div class="pal-g">${x.g}</div>`:'';g=x.g;return h+`<button class="pal-i" role="option" data-act="palGo" data-i="${i}" aria-selected="${i===S.palI}">${I[x.i]}<span>${hl(x.t,S.palQ)}${x.m?`<span class="m"> · ${esc(x.m)}</span>`:''}</span><span class="m">${i===S.palI?'Enter':''}</span></button>`;}).join('')}</div>
  <div class="pal-f"><span><kbd>↑</kbd> <kbd>↓</kbd> выбрать</span><span><kbd>Enter</kbd> открыть</span><span><kbd>Esc</kbd> закрыть</span></div></div></div>`;
 PAL_ITEMS=it;
}
function openPal(){S.pal=true;S.palQ='';S.palI=0;renderPal();const i=document.getElementById('palQ');i&&i.focus();}
function closePal(){S.pal=false;renderPal();}

function vInbox(){
 const items=INBOX;

function botFile(d){const v=cur(d);return `<div class="file"><i>${esc((v.fmt||'').split(',')[0].toUpperCase()||'ФАЙЛ')}</i><div><b>${esc(d.n)}</b><span>ред. ${v.r} из ${d.ver.length} · ${v.d} · ${size(v.s)}</span></div></div>`;}
function botAsk(q,voice){
 const B=S.bot;B.msgs.push(voice?{h:`<div class="voice">${I.mic.replace('<svg','<svg width="15" height="15"')}<i></i><span class="xs">0:03</span></div><span class="xs muted">Распознано: «${esc(q)}»</span>`,t:nowT()}:{h:esc(q),t:nowT()});
 const nq=norm(q);
 const who=['нелли','мари','зверев','юрист','паркет','стройк','заказчик'].find(w=>nq.includes(w));
 if(/ждем|кого|висит/.test(nq)||(who&&/от /.test(' '+q+' '))){const w=openQ().filter(q2=>q2.kind==='ext'&&(!who||norm(q2.from).includes(who)));B.msgs.push({in:1,t:nowT(),h:(who?'Ждём от «'+esc(who)+'…»:':'Ждём:')+'<br>'+(w.map(x=>`• <b>${esc(PRJ[x.p].name)}</b> — ${esc(x.t)}; ${esc(x.from)}, ${dn(x.days)}`).join('<br>')||'никого')});return;}
 if(/получен|оплат|аванс|деньг/.test(nq)){const p=/олимп/.test(nq)?'olimp':'raz_dveri';const l=PAY.filter(x=>x.p===p);B.msgs.push({in:1,t:nowT(),h:`<b>${esc(PRJ[p].name)}</b>: получено ${money(projPaid(p))} из ${money(PRJ[p].sum)}.<br>`+l.filter(x=>payState(x)!=='paid'&&x.due).slice(0,3).map(x=>`• ${x.n}-й — ${money(x.sum)}, ${payState(x)==='late'?'просрочен':'до '+sd(x.due)}`).join('<br>')+`<br><span class="xs muted">источник: журнал проекта</span>`});return;}
 const r=search(q);
 if(!r.length){B.msgs.push({in:1,t:nowT(),h:'Не нашёл. Попробуйте: проект и тип документа, например «смета Олимпийский АГ».'});return;}
 const d=r[0].d;
 B.msgs.push({in:1,t:nowT(),h:`Действующая версия:${botFile(d)}<span class="xs muted">${esc(verChange(d,d.ver.length-1))}</span>`,kb:[{l:'Открыть в приложении',a:'botOpen',id:d.id,w:1},...(d.ver.length>1?[{l:`Все версии (${d.ver.length})`,a:'botVers',id:d.id,w:1}]:[]),...(r.length>1?[{l:'Другие результаты',a:'botMore',q,w:1}]:[])]});
}
function vBot(){
 if(!S.bot)botInit();const B=S.bot;
 return `<div class="ph"><div><div class="eyebrow">Вход и пульт</div><h1>Telegram-бот</h1><p>Тот же архив в мессенджере: найти действующую версию, переслать фото или файл с объекта, спросить «что ждём от Нелли» или «сколько получено по Раздорам». Бот ничего не хранит сам — всё ложится во «Входящие» приложения.</p></div></div>
 <div class="botgrid"><div class="phone" aria-label="Макет телефона">
  <div class="tg-top"><span class="ava">А</span><div><b>АРХИВУД · Архив</b><small>бот</small></div></div>
  <div class="tg-body" id="tgBody">${B.msgs.map((m,i)=>`<div class="b ${m.in?'in':'out'}">${m.fwd?`<div class="fwd">Переслано от ${esc(m.fwd)}</div>`:''}${m.h}${m.kb?`<div class="kb">${m.kb.map(k=>`<button class="${k.w?'wide':''}" data-act="${k.a}" data-id="${k.id==null?'':k.id}" data-i="${i}" data-q="${esc(k.q||'')}">${esc(k.l)}</button>`).join('')}</div>`:''}<small>${m.t||''}</small></div>`).join('')}</div>
  <div class="tg-quick">${['крайняя смета Раздоры','что ждём от Нелли','сколько получено по Раздорам','фиксация'].map(x=>`<button data-act="botQ" data-q="${x}">${x}</button>`).join('')}<button data-act="botPhoto">Переслать фото</button><button data-act="botVoice">Голосом</button></div>
  <form class="tg-in" id="tgForm"><label for="tgT" class="sr">Сообщение</label><input id="tgT" placeholder="Сообщение" autocomplete="off"><button type="submit" aria-label="Отправить">${I.send}</button></form></div>
 <div class="explain"><h2 style="font-family:var(--display);font-size:26px;font-weight:600">Как это работает</h2><ol>
  <li><b>Утром</b> бот пишет каждому: сколько ждут его, сколько ждёт он, есть ли просроченные платежи.</li>
  <li><b>«Крайняя смета Раздоры»</b> — текстом или голосом. Бот присылает действующую версию и строку «что изменилось».</li>
  <li><b>Переслал фото или файл</b> — бот предлагает проект и раздел, человек жмёт одну кнопку. Элемент попадает во «Входящие» или сразу становится версией документа.</li>
  <li><b>«Что ждём от Нелли»</b>, <b>«сколько получено по Раздорам»</b> — короткие ответы с источником.</li>
  <li><b>Если Telegram замедлят или заблокируют</b>, теряется только этот вход. Логика бота переносится на MAX или почту.</li></ol>
  <div class="chips" style="margin-top:18px"><button class="btn" data-act="botReset">Начать сценарий заново</button></div></div></div>`;
}

/* ============ рендер и действия ============ */
function isDark(){const t=document.documentElement.getAttribute('data-theme');if(t)return t==='dark';return !!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);}
function render(){
 renderChrome();
 const V={today:vToday,portfolio:vPortfolio,inbox:vInbox,decisions:vDecisions,project:vProject,doc:vDoc,search:vSearch,compose:vCompose,bot:vBot}[S.view]||vToday;
 app.innerHTML=V();
 const tb=document.getElementById('tgBody');if(tb)tb.scrollTop=tb.scrollHeight;
}
function openProj(p,tab){S.pid=p;S.ptab=tab||(PRJ[p].docsOnly?'docs':'over');S.reg={sec:'all',zone:'',st:'',src:'',q:'',old:false,sort:'date',dir:-1,lim:40};S.jr={src:'',lim:50};go('project');}
function openDoc(id,r){const d=DOC(id);S.pid=d.p;go('doc',{did:d.id});if(r){S.docView=+r;render();}}
function newC(tpl,ans){S.c={tpl,ans:ans||{},draft:false,fixOpen:false,fixes:[],accepted:null};}
const ACT={
 go:e=>go(e.v),
 proj:e=>openProj(e.p,e.tab),
 ptab:e=>{S.ptab=e.t;render();},
 doc:e=>openDoc(e.id,e.r),
 dview:e=>{const d=DOC(S.did);S.docView=e.r&&+e.r!==d.ver.length?+e.r:null;render();window.scrollTo({top:0,behavior:'smooth'});},
 regsec:e=>{S.reg.sec=e.sec;S.reg.lim=40;render();},
 sort:e=>{if(S.reg.sort===e.k)S.reg.dir*=-1;else{S.reg.sort=e.k;S.reg.dir=e.k==='date'||e.k==='rev'?-1:1;}render();},
 regMore:()=>{S.reg.lim+=60;render();},
 jrMore:()=>{S.jr.lim+=50;render();},
 pos:e=>{S.openPos[e.k]=!S.openPos[e.k];render();},
 qp:e=>{S.qp=e.v;render();},
 done:e=>{const q=Q.find(x=>x.id===+e.id);S.done[e.id]=1;toast('Готово: «'+q.t+'». Запись в журнале.');render();},
 remind:e=>{const q=Q.find(x=>x.id===+e.id);const txt=`${q.from.split(':').pop().trim().split(',')[0]}, добрый день! Напоминаю: ${q.t.charAt(0).toLowerCase()+q.t.slice(1)} — ждём с ${sd(q.since)}. Подскажите, когда ждать ответ?`;
  try{navigator.clipboard.writeText(txt).then(()=>toast('Текст напоминания скопирован — вставьте в Telegram.'),()=>toast(txt));}catch(x){toast(txt);}},
 confirm:e=>{const d=DEC.find(x=>x.id===+e.id);S.done['d'+d.id]=1;const doc=find(d.p,/^ЖУРНАЛ ПРОЕКТА/);if(doc)EXTRA.push({p:d.p,k:'2026-11-03 '+nowT(),d:'03.11.2026',t:nowT(),doc,v:cur(doc),type:'dec',who:TEAM[S.me].n,note:'подтверждено: '+d.t});toast('Решение подтверждено. Создан чек-лист «куда внести».');render();},
 into:e=>{S.done[e.k]=+e.v;render();},
 xpick:e=>{S.done['x'+e.id]=+e.i;const x=XD.find(y=>y.id===+e.id);toast('Действующее значение: '+x.v[+e.i-1][0]+'. Предложено решение — подтвердите в списке решений.');render();},
 inbOk:e=>{const x=INBOX[+e.i];x.state='ok';EXTRA.push({p:x.d.p,k:'2026-11-03 '+nowT(),d:'03.11.2026',t:nowT(),doc:x.d,v:cur(x.d),type:'inb',who:TEAM[S.me].n,note:'разобрано из входящих'});toast('Подтверждено: '+PRJ[x.d.p].name+' → '+secName(x.d.sec));render();},
 inbNo:e=>{INBOX[+e.i].state='no';render();},
 search:e=>{S.q='';go('search');},
 fp:e=>{S.fp=e.v;render();},fs:e=>{S.fs=e.v;render();},
 q:e=>{S.q=e.q;S.voiceMsg='';S.fp='';S.fs='';render();},
 mic:()=>startMic(),
 pal:()=>openPal(),
 palClose:(e,ev)=>{if(ev.target.classList.contains('pal-bg'))closePal();},
 palGo:e=>{const it=PAL_ITEMS[+e.i];closePal();it&&it.a();},
 theme:()=>{const n=isDark()?'light':'dark';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('av-theme',n);}catch(x){}render();},
 sendDoc:()=>{const d=DOC(S.did);toast(isInternal(d)?'Это внутренний документ — наружу не отправляется.':'«'+d.n+'», ред. '+cur(d).r+' — отправка попадёт в журнал. В прототипе письмо не уходит.');},
 approve:()=>{const d=DOC(S.did);const order=['draft','review','ok','prod'];const i=order.indexOf(d.st);d.st=order[(i+1)%order.length];EXTRA.push({p:d.p,k:'2026-11-03 '+nowT(),d:'03.11.2026',t:nowT(),doc:d,v:cur(d),type:'st',who:TEAM[S.me].n,note:'статус: '+STN[d.st]});toast('Статус: '+STN[d.st]+'. Запись в журнале.');render();},
 composePay:()=>{newC('pay');go('compose');},
 cTpl:e=>{newC(e.tpl);render();},
 cAns:e=>{S.c.ans[e.k]=e.v;render();},
 cUndo:e=>{const qs=TPL[S.c.tpl].qs(S.c.ans);const i=qs.findIndex(q=>q.k===e.k);qs.slice(i).forEach(q=>delete S.c.ans[q.k]);if(e.k==='proj')S.c.ans={};S.c.draft=false;S.c.accepted=null;render();},
 cGen:()=>{S.c.draft=true;render();},
 cFix:()=>{S.c.fixOpen=!S.c.fixOpen;render();const t=document.getElementById('fixT');t&&t.focus();},
 cFixQ:e=>{const t=document.getElementById('fixT');if(t)t.value=e.t;},
 cFixGo:()=>{const t=document.getElementById('fixT');const v=t&&t.value.trim();if(!v){toast('Напишите, что поправить, или выберите подсказку.');return;}S.c.fixes.push(v);S.c.fixOpen=false;toast('Правка учтена, черновик пересобран.');render();},
 cAccept:()=>cAccept(),
 cReset:()=>{newC(null);render();},
 botQ:e=>{botAsk(e.q);render();},
 botVoice:()=>{botAsk('крайняя смета Раздоры',true);render();},
 botOpen:e=>openDoc(e.id),
 botMore:e=>{const r=search(e.q).slice(1,5);S.bot.msgs.push({in:1,t:nowT(),h:'Ещё:<br>'+r.map(x=>`• ${esc(x.d.n)} — ${esc(PRJ[x.d.p].name)}, ред. ${x.v.r}`).join('<br>')});render();},
 botVers:e=>{const d=DOC(e.id);S.bot.msgs.push({in:1,t:nowT(),h:`Версии «${esc(d.n)}»:<br>`+d.ver.slice().reverse().slice(0,8).map(v=>`• ред. ${v.r} · ${v.d} — ${esc(srcLabel(v.src))}${v===cur(d)?' <b>(действующая)</b>':''}`).join('<br>')+(d.ver.length>8?`<br>…и ещё ${d.ver.length-8}`:'')});render();},
 botPhoto:()=>{S.bot.msgs.push({fwd:'Мансур',t:nowT(),h:`<div class="thumbs"><i class="w0"></i><i class="w2"></i></div><span class="xs">Коробки, 2 этаж — монтаж</span>`});
  S.bot.msgs.push({in:1,t:nowT(),h:'Похоже на <b>Раздоры. Двери</b> → Фото с объектов (по словам «коробки», «2 этаж»). Верно?',kb:[{l:'Да, Раздоры. Двери',a:'botPick',id:'raz_dveri',w:1},{l:'Раздоры. Мебель',a:'botPick',id:'raz_mebel'},{l:'Олимпийский',a:'botPick',id:'olimp'}]});render();},
 botPick:e=>{const m=S.bot.msgs[+e.i];if(m)m.kb=null;const p=PRJ[e.id];S.bot.msgs.push({h:esc(p.name),t:nowT()});
  const tm=nowT();const d={id:DOCS.length,p:p.id,sec:'Фото',zone:'2 этаж',rol:'',n:'Коробки, 2 этаж — монтаж',st:'ok',ver:[{r:1,d:'03.11.2026',t:tm,k:'2026-11-03 '+tm,file:'photo_2026-11-03.jpg',fmt:'jpg',s:2400000,src:'из Telegram: Мансур (через бота)',tema:''}]};
  d.code='ФТ-'+String(DOCS.filter(x=>x.p===p.id&&x.sec==='Фото').length+1).padStart(3,'0');d.hay=norm(d.n+' '+p.name+' фото');d.hayV=[''];DOCS.push(d);
  S.bot.msgs.push({in:1,t:nowT(),h:`Сохранил: <b>${esc(p.name)}</b> → Фото с объектов, 2 этаж. Запись в журнале проекта.`,kb:[{l:'Открыть в приложении',a:'botOpen',id:d.id,w:1}]});render();},
 botReset:()=>{botInit();render();}
};
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-act]');if(!el)return;const f=ACT[el.dataset.act];if(!f)return;if(el.dataset.act==='palClose'&&ev.target!==el)return;ev.preventDefault();f(el.dataset,ev);});
document.addEventListener('change',ev=>{const el=ev.target;const k=el.dataset&&el.dataset.ch;if(!k)return;const R=S.reg;
 if(k==='me'){S.me=el.value;S.bot=null;render();}
 if(k==='old'){S.old=el.checked;render();}
 if(k==='regOld'){R.old=el.checked;render();}
 if(k==='regZ'){R.zone=el.value;render();} if(k==='regS'){R.st=el.value;render();} if(k==='regSrc'){R.src=el.value;render();}
 if(k==='jrSrc'){S.jr.src=el.value;S.jr.lim=50;render();}
 if(k==='cmpA'){S.cmpA=+el.value;S.cmpB=S.cmpB||DOC(S.did).ver.length;render();}
 if(k==='cmpB'){S.cmpB=+el.value;S.cmpA=S.cmpA||Math.max(1,DOC(S.did).ver.length-1);render();}});
let typeT;
function refocus(id,pos){const q=document.getElementById(id);if(q){q.focus();try{q.setSelectionRange(pos,pos);}catch(e){}}}
document.addEventListener('input',ev=>{const t=ev.target;
 if(t.id==='q'){S.q=t.value;S.voiceMsg='';S.fp='';S.fs='';clearTimeout(typeT);typeT=setTimeout(()=>{const pos=t.selectionStart;render();refocus('q',pos);},200);}
 if(t.id==='regQ'){S.reg.q=t.value;clearTimeout(typeT);typeT=setTimeout(()=>{const pos=t.selectionStart;render();refocus('regQ',pos);},200);}
 if(t.id==='palQ'){S.palQ=t.value;S.palI=0;const pos=t.selectionStart;renderPal();refocus('palQ',pos);}});
document.addEventListener('submit',ev=>{ev.preventDefault();
 if(ev.target.id==='tgForm'){const t=document.getElementById('tgT');const v=t.value.trim();if(!v)return;botAsk(v);render();const n=document.getElementById('tgT');n&&n.focus();}
 if(ev.target.id==='sform')render();});
document.addEventListener('keydown',ev=>{
 if((ev.ctrlKey||ev.metaKey)&&(ev.key==='k'||ev.key==='K'||ev.key==='л'||ev.key==='Л')){ev.preventDefault();S.pal?closePal():openPal();return;}
 if(!S.pal)return;
 if(ev.key==='Escape')closePal();
 else if(ev.key==='ArrowDown'){ev.preventDefault();S.palI=Math.min(PAL_ITEMS.length-1,S.palI+1);renderPal();refocus('palQ',S.palQ.length);}
 else if(ev.key==='ArrowUp'){ev.preventDefault();S.palI=Math.max(0,S.palI-1);renderPal();refocus('palQ',S.palQ.length);}
 else if(ev.key==='Enter'){ev.preventDefault();const it=PAL_ITEMS[S.palI];closePal();it&&it.a();}});
window.addEventListener('hashchange',()=>{const v=S.view,p=S.pid,d=S.did;fromHash();if(S.view!==v||S.pid!==p||S.did!==d)render();});
try{const t=localStorage.getItem('av-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}
fromHash();
render();
})();
</script>
